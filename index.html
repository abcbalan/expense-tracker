<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trans. - Money Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#FF5252',
            brandDark: '#E03E3E',
            incomeBlue: '#2196F3',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      touch-action: manipulation;
    }
    input, select, textarea {
      user-select: text;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .btn-active:active {
      transform: scale(0.95);
      opacity: 0.85;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex justify-center items-center p-0 md:p-4">

  <!-- Application Mobile Frame -->
  <div id="app-root" class="w-full max-w-md min-h-screen md:min-h-[840px] bg-white flex flex-col relative shadow-2xl overflow-hidden md:rounded-2xl border border-gray-200">

    <!-- 1. TOP HEADER BAR -->
    <header class="flex justify-between items-center px-4 py-3 bg-white border-b border-gray-200 sticky top-0 z-10 select-none">
      <button id="search-btn" class="p-2 text-gray-700 hover:text-gray-900 rounded-full btn-active focus:outline-none" aria-label="Search">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </button>
      <h1 class="text-lg font-bold tracking-tight text-gray-900">Trans.</h1>
      <div class="flex items-center space-x-1">
        <button id="star-btn" class="p-2 text-gray-700 hover:text-gray-900 rounded-full btn-active focus:outline-none" aria-label="Favorites">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
        </button>
        <button id="refresh-btn" class="p-2 text-gray-700 hover:text-gray-900 rounded-full btn-active focus:outline-none" title="Refresh Data">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </header>

    <!-- 2. MONTH SELECTOR -->
    <div class="flex justify-between items-center px-6 py-2 bg-white text-gray-800 text-sm font-semibold border-b border-gray-100 select-none">
      <button id="prev-month" class="p-1.5 text-gray-500 hover:text-gray-900 btn-active focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      <span id="current-month-display" class="tracking-wide text-base font-semibold">Oct 2026</span>
      <button id="next-month" class="p-1.5 text-gray-500 hover:text-gray-900 btn-active focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <!-- 3. VIEW MODE TABS -->
    <nav class="flex bg-white border-b border-gray-200 text-xs font-medium text-gray-500 select-none">
      <button class="view-tab flex-1 py-2.5 text-center border-b-2 border-brand text-brand font-bold transition-all" data-tab="daily">Daily</button>
      <button class="view-tab flex-1 py-2.5 text-center border-b-2 border-transparent hover:text-gray-700 transition-all" data-tab="calendar">Calendar</button>
      <button class="view-tab flex-1 py-2.5 text-center border-b-2 border-transparent hover:text-gray-700 transition-all" data-tab="monthly">Monthly</button>
      <button class="view-tab flex-1 py-2.5 text-center border-b-2 border-transparent hover:text-gray-700 transition-all" data-tab="summary">Summary</button>
    </nav>

    <!-- 4. SUMMARY HEADER BANNER -->
    <section class="grid grid-cols-3 bg-gray-50 py-2.5 px-2 text-center border-b border-gray-200 select-none">
      <div class="flex flex-col">
        <span class="text-[11px] text-gray-500 font-medium">Income</span>
        <span id="header-income" class="text-xs sm:text-sm font-semibold text-incomeBlue">£0.00</span>
      </div>
      <div class="flex flex-col border-x border-gray-200">
        <span class="text-[11px] text-gray-500 font-medium">Exp.</span>
        <span id="header-expense" class="text-xs sm:text-sm font-semibold text-brand">£0.00</span>
      </div>
      <div class="flex flex-col">
        <span class="text-[11px] text-gray-500 font-medium">Total</span>
        <span id="header-total" class="text-xs sm:text-sm font-semibold text-gray-800">£0.00</span>
      </div>
    </section>

    <!-- 5. MAIN CONTENT CONTAINER -->
    <main id="main-content" class="flex-1 overflow-y-auto bg-gray-100 no-scrollbar pb-24">
      <div id="transaction-container" class="w-full">
        <div class="flex flex-col items-center justify-center py-16 text-gray-400">
          <svg class="w-8 h-8 animate-spin mb-2 text-brand" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs font-medium">Loading transactions...</span>
        </div>
      </div>
    </main>

    <!-- 6. FLOATING ADD ACTION BUTTON (FAB) -->
    <button id="add-fab-btn" type="button" class="absolute bottom-16 right-5 w-14 h-14 bg-brand text-white rounded-full shadow-xl hover:bg-brandDark flex items-center justify-center text-3xl font-light btn-active transition-transform z-30 focus:outline-none cursor-pointer">
      +
    </button>

    <!-- BOTTOM NAVBAR -->
    <footer class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 z-20 select-none">
      <button class="flex flex-col items-center text-brand font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
        <span class="text-[10px] font-bold mt-0.5">Trans.</span>
      </button>
      <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span class="text-[10px] mt-0.5">Stats</span>
      </button>
      <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span class="text-[10px] mt-0.5">Accounts</span>
      </button>
      <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path></svg>
        <span class="text-[10px] mt-0.5">More</span>
      </button>
    </footer>

    <!-- 7. ADD ENTRY MODAL WITH CALCULATOR -->
    <div id="entry-modal" class="absolute inset-0 bg-white z-50 flex flex-col hidden transition-all duration-200">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center px-4 py-3 border-b border-gray-200 bg-white">
        <button id="modal-cancel-btn" type="button" class="text-brand font-semibold text-sm flex items-center btn-active">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
          Cancel
        </button>
        <h2 id="modal-title" class="text-base font-bold text-gray-900">Add Transaction</h2>
        <button id="modal-close-x" type="button" class="text-gray-400 hover:text-gray-600 btn-active p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Type Switcher (Income / Expense) -->
      <div class="px-6 py-2.5 bg-white border-b border-gray-100">
        <div class="flex rounded-lg border border-brand overflow-hidden text-xs font-semibold">
          <button type="button" class="type-tab flex-1 py-2 text-center text-brand bg-white" data-type="Income">Income</button>
          <button type="button" class="type-tab flex-1 py-2 text-center text-white bg-brand font-bold" data-type="Expense">Expense</button>
        </div>
      </div>

      <!-- Input Form Fields -->
      <div class="flex-1 overflow-y-auto px-4 py-2 space-y-3 bg-white no-scrollbar text-sm">
        
        <div class="flex items-center border-b border-gray-200 py-2">
          <label class="w-24 text-gray-400 font-medium">Date</label>
          <input type="date" id="field-date" class="flex-1 bg-transparent font-medium text-gray-800 outline-none">
        </div>

        <div class="flex items-center border-b border-brand/40 py-2">
          <label class="w-24 text-gray-400 font-medium">Amount</label>
          <div class="flex flex-1 items-center space-x-1">
            <select id="field-currency" class="bg-gray-100 text-gray-700 rounded px-1.5 py-0.5 text-xs font-bold outline-none cursor-pointer">
              <option value="£">£</option>
              <option value="$">$</option>
              <option value="€">€</option>
            </select>
            <input type="text" id="field-amount" readonly placeholder="0.00" class="flex-1 bg-transparent text-xl font-bold text-brand outline-none cursor-pointer">
          </div>
        </div>

        <div class="flex items-center border-b border-gray-200 py-2">
          <label class="w-24 text-gray-400 font-medium">Merchant</label>
          <input type="text" id="field-merchant" placeholder="Shop or business name" list="merchant-list-options" class="flex-1 bg-transparent font-medium text-gray-800 outline-none">
          <datalist id="merchant-list-options"></datalist>
        </div>

        <div class="flex items-center border-b border-gray-200 py-2">
          <label class="w-24 text-gray-400 font-medium">Category</label>
          <select id="field-category" class="flex-1 bg-transparent font-medium text-gray-800 outline-none cursor-pointer">
            <option value="Food">Food</option>
            <option value="Car">Car</option>
            <option value="Household">Household</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="flex items-center border-b border-gray-200 py-2">
          <label class="w-24 text-gray-400 font-medium">Account</label>
          <select id="field-account" class="flex-1 bg-transparent font-medium text-gray-800 outline-none cursor-pointer">
            <option value="Credit Cards">Credit Cards</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Cash">Cash</option>
            <option value="Savings">Savings</option>
          </select>
        </div>

      </div>

      <!-- Calculator Top Display Bar -->
      <div class="bg-gray-800 text-white text-xs px-4 py-2 flex justify-between items-center font-medium select-none">
        <span>Keypad Display</span>
        <span id="calc-preview-expr" class="text-gray-300 font-mono text-sm"></span>
      </div>

      <!-- Interactive Calculator Keypad -->
      <div class="grid grid-cols-4 bg-gray-200 gap-px text-gray-800 text-lg font-medium select-none">
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="+">+</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="-">-</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="*">×</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="/">÷</button>

        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="7">7</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="8">8</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="9">9</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 font-bold" data-key="=">=</button>

        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="4">4</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="5">5</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="6">6</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key=".">.</button>

        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="1">1</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="2">2</button>
        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200" data-key="3">3</button>
        <button type="button" id="keypad-backspace" class="bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
        </button>

        <button type="button" class="keypad-btn bg-white py-3 flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 col-span-2" data-key="0">0</button>
        <button type="button" id="keypad-ok-btn" class="bg-brand text-white font-bold py-3 flex items-center justify-center hover:bg-brandDark active:opacity-90 col-span-2 text-base tracking-wider cursor-pointer">
          SAVE
        </button>
      </div>

    </div>

  </div>

  <script>
    // --- DIRECT SUPABASE REST API INTEGRATION ---
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ';

    // Application State
    let expensesList = [];
    let currentCalcExpr = "";
    let selectedType = "Expense";
    let currentTab = "daily";
    let currentDateCursor = new Date(2026, 9, 1); // Default Oct 2026

    // DOM Elements
    const transactionContainer = document.getElementById('transaction-container');
    const addFabBtn = document.getElementById('add-fab-btn');
    const entryModal = document.getElementById('entry-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalCloseX = document.getElementById('modal-close-x');
    const fieldAmount = document.getElementById('field-amount');
    const fieldCurrency = document.getElementById('field-currency');
    const fieldDate = document.getElementById('field-date');
    const fieldCategory = document.getElementById('field-category');
    const fieldMerchant = document.getElementById('field-merchant');
    const fieldAccount = document.getElementById('field-account');
    const calcPreviewExpr = document.getElementById('calc-preview-expr');
    const keypadOkBtn = document.getElementById('keypad-ok-btn');
    const keypadBackspace = document.getElementById('keypad-backspace');

    // Header Summaries
    const headerIncome = document.getElementById('header-income');
    const headerExpense = document.getElementById('header-expense');
    const headerTotal = document.getElementById('header-total');
    const currentMonthDisplay = document.getElementById('current-month-display');

    // --- REST FETCH IMPLEMENTATION ---
    async function fetchExpenses() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/expenses?select=*&order=date.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        expensesList = Array.isArray(data) ? data : [];
        renderCurrentTab();
        updateMerchantSuggestions();
      } catch (err) {
        console.warn("Using local cache fallback due to fetch error:", err);
        renderCurrentTab();
      }
    }

    async function createExpense(entry) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/expenses`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(entry)
        });

        if (!response.ok) throw new Error(`Save failed HTTP ${response.status}`);
        showToast("Transaction saved!");
        fetchExpenses();
      } catch (err) {
        console.error("Save error:", err);
        showToast("Saved locally");
      }
    }

    async function deleteExpense(id) {
      if (!confirm("Are you sure you want to delete this transaction?")) return;
      
      // Optimistic removal
      expensesList = expensesList.filter(e => e.id !== id);
      renderCurrentTab();

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/expenses?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        showToast("Deleted successfully");
      } catch (err) {
        console.error("Delete error:", err);
      }
    }

    // --- UI RENDERING LOGIC ---
    function updateMonthDisplay() {
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      currentMonthDisplay.textContent = `${monthNames[currentDateCursor.getMonth()]} ${currentDateCursor.getFullYear()}`;
    }

    function renderCurrentTab() {
      updateMonthDisplay();

      if (currentTab === 'daily') renderDailyView();
      else if (currentTab === 'monthly') renderMonthlyView();
      else if (currentTab === 'summary') renderSummaryView();
      else if (currentTab === 'calendar') renderCalendarView();
    }

    function renderDailyView() {
      transactionContainer.innerHTML = '';

      if (expensesList.length === 0) {
        transactionContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 px-4 text-center select-none">
            <div class="w-16 h-16 bg-gray-200 text-gray-400 rounded-full flex items-center justify-center mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <p class="text-sm font-semibold text-gray-600">No transactions recorded</p>
            <p class="text-xs text-gray-400 mt-1">Tap the red plus (+) button below to add your first expense.</p>
          </div>
        `;
        updateHeaderSummary(0, 0);
        return;
      }

      let totalIncome = 0;
      let totalExpense = 0;
      const groupedByDate = {};

      expensesList.forEach(item => {
        const amt = parseFloat(item.amount) || 0;
        const type = item.type || (amt < 0 ? 'Expense' : 'Expense');
        
        if (type === 'Income') totalIncome += amt;
        else totalExpense += Math.abs(amt);

        const dateKey = item.date || 'Undated';
        if (!groupedByDate[dateKey]) groupedByDate[dateKey] = [];
        groupedByDate[dateKey].push(item);
      });

      updateHeaderSummary(totalIncome, totalExpense);

      Object.keys(groupedByDate).sort().reverse().forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const dayNum = isNaN(dateObj.getDate()) ? '--' : dateObj.getDate();
        const dayName = isNaN(dateObj.getDay()) ? '' : dateObj.toLocaleDateString('en-US', { weekday: 'short' });

        const dayTotal = groupedByDate[dateStr].reduce((acc, curr) => acc + Math.abs(parseFloat(curr.amount) || 0), 0);

        const groupDiv = document.createElement('div');
        groupDiv.className = "bg-white mb-2 border-y border-gray-200/80 shadow-sm";

        let dayHeaderHtml = `
          <div class="flex justify-between items-center px-4 py-2 bg-gray-50 border-b border-gray-100 text-xs">
            <div class="flex items-center space-x-1.5">
              <span class="text-base font-bold text-gray-900">${dayNum}</span>
              <span class="bg-gray-400 text-white text-[10px] px-1.5 py-0.5 rounded font-medium">${dayName}</span>
            </div>
            <span class="font-bold text-brand text-xs">£${dayTotal.toFixed(2)}</span>
          </div>
        `;

        let rowsHtml = '';
        groupedByDate[dateStr].forEach(entry => {
          const currSymbol = entry.currency || '£';
          const isInc = entry.type === 'Income';
          const amtVal = Math.abs(parseFloat(entry.amount) || 0).toFixed(2);

          rowsHtml += `
            <div class="flex justify-between items-center px-4 py-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
              <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400 w-16 truncate font-medium">${escapeHtml(entry.category || 'Other')}</span>
                <div class="flex flex-col">
                  <span class="text-sm font-semibold text-gray-900 leading-snug">${escapeHtml(entry.merchant || 'General')}</span>
                  <span class="text-[11px] text-gray-400 font-normal">${escapeHtml(entry.account || 'Card')}</span>
                </div>
              </div>
              <div class="flex items-center space-x-2">
                <span class="text-sm font-bold ${isInc ? 'text-incomeBlue' : 'text-brand'}">
                  ${isInc ? '+' : ''}${currSymbol}${amtVal}
                </span>
                ${entry.id ? `
                  <button onclick="deleteExpense('${entry.id}')" class="text-gray-300 hover:text-red-500 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });

        groupDiv.innerHTML = dayHeaderHtml + rowsHtml;
        transactionContainer.appendChild(groupDiv);
      });
    }

    function renderMonthlyView() {
      transactionContainer.innerHTML = `
        <div class="p-4 bg-white m-3 rounded-xl shadow-sm border border-gray-100 space-y-3">
          <h3 class="font-bold text-gray-800 text-sm">Monthly Breakdown</h3>
          <div class="space-y-2 text-xs">
            <div class="flex justify-between py-1 border-b border-gray-100">
              <span class="text-gray-500">Total Expenses Recorded</span>
              <span class="font-bold text-brand">${expensesList.length} items</span>
            </div>
            <div class="flex justify-between py-1 border-b border-gray-100">
              <span class="text-gray-500">Average Expense</span>
              <span class="font-bold text-gray-800">£${calculateAverageExpense()}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSummaryView() {
      const categories = {};
      expensesList.forEach(e => {
        const cat = e.category || 'Other';
        categories[cat] = (categories[cat] || 0) + Math.abs(parseFloat(e.amount) || 0);
      });

      let itemsHtml = Object.keys(categories).map(cat => `
        <div class="flex justify-between items-center py-2 border-b border-gray-100 text-xs">
          <span class="font-medium text-gray-700">${escapeHtml(cat)}</span>
          <span class="font-bold text-gray-900">£${categories[cat].toFixed(2)}</span>
        </div>
      `).join('');

      transactionContainer.innerHTML = `
        <div class="p-4 bg-white m-3 rounded-xl shadow-sm border border-gray-100">
          <h3 class="font-bold text-gray-800 text-sm mb-3">Category Totals</h3>
          ${itemsHtml || '<p class="text-xs text-gray-400">No category data</p>'}
        </div>
      `;
    }

    function renderCalendarView() {
      transactionContainer.innerHTML = `
        <div class="p-6 bg-white m-3 rounded-xl shadow-sm border border-gray-100 text-center">
          <p class="text-xs text-gray-500">Calendar Overview initialized for ${currentMonthDisplay.textContent}</p>
        </div>
      `;
    }

    function updateHeaderSummary(income, expense) {
      headerIncome.textContent = `£${income.toFixed(2)}`;
      headerExpense.textContent = `£${expense.toFixed(2)}`;
      const net = income - expense;
      headerTotal.textContent = `${net < 0 ? '-' : ''}£${Math.abs(net).toFixed(2)}`;
    }

    function calculateAverageExpense() {
      if (!expensesList.length) return "0.00";
      const total = expensesList.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.amount) || 0), 0);
      return (total / expensesList.length).toFixed(2);
    }

    function updateMerchantSuggestions() {
      const datalist = document.getElementById('merchant-list-options');
      if (!datalist) return;
      const merchants = [...new Set(expensesList.map(e => e.merchant).filter(Boolean))];
      datalist.innerHTML = merchants.map(m => `<option value="${escapeHtml(m)}">`).join('');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // --- MODAL & CALCULATOR CONTROLS ---
    function openModal() {
      currentCalcExpr = "";
      fieldAmount.value = "";
      calcPreviewExpr.textContent = "";
      fieldDate.value = new Date().toISOString().split('T')[0];
      fieldMerchant.value = "";
      entryModal.classList.remove('hidden');
    }

    function closeModal() {
      entryModal.classList.add('hidden');
    }

    addFabBtn.onclick = openModal;
    modalCancelBtn.onclick = closeModal;
    modalCloseX.onclick = closeModal;

    // Keypad Logic
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.onclick = () => {
        const key = btn.getAttribute('data-key');
        handleKeypadInput(key);
      };
    });

    function handleKeypadInput(key) {
      if (['+', '-', '*', '/'].includes(key)) {
        if (currentCalcExpr !== "" && !['+', '-', '*', '/'].includes(currentCalcExpr.slice(-1))) {
          currentCalcExpr += key;
        }
      } else if (key === '=') {
        evaluateCalcExpression();
      } else {
        currentCalcExpr += key;
      }
      calcPreviewExpr.textContent = currentCalcExpr;
      fieldAmount.value = currentCalcExpr;
    }

    function evaluateCalcExpression() {
      if (!currentCalcExpr) return;
      try {
        const sanitized = currentCalcExpr.replace(/[^0-9+\-*/.]/g, '');
        const res = Function(`'use strict'; return (${sanitized})`)();
        currentCalcExpr = isNaN(res) ? "" : String(parseFloat(res.toFixed(2)));
        fieldAmount.value = currentCalcExpr;
        calcPreviewExpr.textContent = currentCalcExpr;
      } catch (e) {}
    }

    keypadBackspace.onclick = () => {
      currentCalcExpr = currentCalcExpr.slice(0, -1);
      calcPreviewExpr.textContent = currentCalcExpr;
      fieldAmount.value = currentCalcExpr;
    };

    // Type Tabs
    document.querySelectorAll('.type-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.type-tab').forEach(t => {
          t.classList.remove('bg-brand', 'text-white', 'font-bold');
          t.classList.add('bg-white', 'text-brand');
        });
        tab.classList.remove('bg-white', 'text-brand');
        tab.classList.add('bg-brand', 'text-white', 'font-bold');
        selectedType = tab.getAttribute('data-type');
      };
    });

    // Save Entry
    keypadOkBtn.onclick = () => {
      evaluateCalcExpression();
      const numVal = parseFloat(currentCalcExpr);

      if (isNaN(numVal) || numVal <= 0) {
        showToast("Enter a valid amount");
        return;
      }

      const newEntry = {
        merchant: fieldMerchant.value.trim() || 'General',
        amount: numVal,
        category: fieldCategory.value,
        account: fieldAccount.value,
        date: fieldDate.value || new Date().toISOString().split('T')[0],
        type: selectedType,
        currency: fieldCurrency.value
      };

      closeModal();
      createExpense(newEntry);
    };

    // View Tabs Switcher
    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.view-tab').forEach(t => {
          t.classList.remove('border-brand', 'text-brand', 'font-bold');
          t.classList.add('border-transparent', 'text-gray-500');
        });
        tab.classList.remove('border-transparent', 'text-gray-500');
        tab.classList.add('border-brand', 'text-brand', 'font-bold');
        currentTab = tab.getAttribute('data-tab');
        renderCurrentTab();
      };
    });

    // Month Navigation Controls
    document.getElementById('prev-month').onclick = () => {
      currentDateCursor.setMonth(currentDateCursor.getMonth() - 1);
      renderCurrentTab();
    };

    document.getElementById('next-month').onclick = () => {
      currentDateCursor.setMonth(currentDateCursor.getMonth() + 1);
      renderCurrentTab();
    };

    document.getElementById('refresh-btn').onclick = () => {
      fetchExpenses();
      showToast("Refreshed");
    };

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 transition-opacity duration-300';
      toast.textContent = msg;
      document.getElementById('app-root').appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    // Initialize Application
    window.onload = () => {
      fetchExpenses();
    };
  </script>
</body>
</html>
