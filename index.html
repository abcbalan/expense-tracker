<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ExpenseTracker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .app-container { width: 100%; max-width: 480px; background: #fff; height: 100%; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    #auth-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:#fff; z-index:999; display:flex; flex-direction:column; justify-content:center; align-items:center; paddin[...]
    #auth-screen h2 { margin-bottom: 20px; color: #10b981; }
    .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .auth-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .auth-btn:disabled { background: #a7f3d0; cursor: not-allowed; }
    .auth-error { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    .top-bar { background: #10b981; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .top-actions { display: flex; gap: 12px; align-items: center; }
    .icon-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    .month-nav { background: #059669; color: white; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
    .month-nav button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 0 8px; }
    .summary-bar { background: #ecfdf5; padding: 10px 16px; display: flex; justify-content: space-around; border-bottom: 1px solid #e5e7eb; font-size: 13px; text-align: center; }
    .summary-item-box div:first-child { color: #6b7280; font-size: 11px; }
    .summary-item-box div:last-child { font-weight: 600; color: #111827; margin-top: 2px; }
    .view-tabs { display: flex; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    .view-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500; color: #4b5563; cursor: pointer; border-bottom: 2px solid transparent; }
    .view-tab.active { color: #10b981; border-bottom-color: #10b981; background: #fff; }
    .main-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .main-screen.active { display: flex; }
    .content-area { flex: 1; overflow-y: auto; background: #f9fafb; padding-bottom: 80px; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .day-group { margin-bottom: 12px; background: #fff; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; }
    .day-header { padding: 8px 16px; background: #f3f4f6; display: flex; justify-content: space-between; font-size: 12px; color: #4b5563; }
    .trans-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
    .trans-row:active { background: #f9fafb; }
    .trans-left { display: flex; flex-direction: column; gap: 2px; }
    .trans-category { font-size: 11px; background: #e5e7eb; padding: 2px 6px; border-radius: 4px; width: fit-content; color: #374151; font-weight: 500; }
    .trans-details strong { font-size: 14px; color: #111827; }
    .trans-amount { font-size: 15px; font-weight: 600; color: #ef4444; }
    .fab { position: absolute; bottom: 75px; right: 20px; width: 56px; height: 56px; background: #10b981; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: cen[...]
    .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; align-items: cen[...]
    .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #9ca3af; cursor: pointer; width: 50%; }
    .nav-item.active { color: #10b981; font-weight: 600; }
    .nav-item span:first-child { font-size: 20px; }
    .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; justify-content: flex-end; flex-direction: column; }
    .modal-content { background: #fff; width: 100%; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 16px; display: flex; flex-direction: column; max-height: 90vh; overflow-y:[...]
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 600; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .key-btn { padding: 14px; background: #f3f4f6; border: none; border-radius: 8px; font-size: 18px; font-weight: 500; cursor: pointer; text-align: center; color: #1f2937; }
    .key-btn:active { background: #e5e7eb; }
    .key-btn.ok { background: #10b981; color: white; grid-row: span 2; height: 100%; display: flex; align-items: center; justify-content: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #e5e7eb; padding: 2px; }
    .cal-day-name { background: #f3f4f6; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 600; color: #4b5563; }
    .cal-cell { background: #fff; min-height: 60px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; }
    .cal-cell.empty { background: #fafafa; }
    .cal-date-num { font-size: 11px; font-weight: 500; color: #374151; }
    .cal-spend { font-size: 10px; color: #ef4444; font-weight: 600; text-align: right; }
    .summary-item { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f3f4f6; }
    .summary-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .progress-bg { background: #f3f4f6; height: 6px; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .stats-container { padding: 16px; background: #fff; display: flex; flex-direction: column; align-items: center; }
    .pie-chart { width: 160px; height: 160px; border-radius: 50%; margin: 16px 0; position: relative; }
    .stats-row { width: 100%; display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
    .badge-percent { padding: 2px 6px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; }
    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
    .cat-tile { background: #f3f4f6; padding: 12px; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; [...]
    .cat-tile:active { background: #e5e7eb; }
    .cat-tile span { font-size: 20px; }
    .cat-tile.add-tile { background: #ecfdf5; color: #10b981; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="auth-screen">
      <h2>ExpenseTracker Login</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      <button id="btn-login" class="auth-btn" onclick="login()">Sign In</button>
      <div id="auth-error" class="auth-error"></div>
    </div>

    <div id="screen-trans" class="main-screen active">
      <div class="top-bar">
        <h1>ExpenseTracker</h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-search" title="Search">🔍</button>
          <label class="icon-btn" title="Import Excel/CSV" style="cursor:pointer;">📂<input type="file" id="import-file-input" accept=".xlsx, .xls, .csv" style="display:none;"></label>
          <button class="icon-btn" id="btn-export-excel" title="Export CSV">📥</button>
          <button class="icon-btn" id="btn-sync" title="Sync Cloud">🔄</button>
          <button class="icon-btn" id="btn-logout" title="Logout">🚪</button>
        </div>
      </div>

      <div class="month-nav">
        <button class="btn-prev-m">◀</button>
        <span class="current-month-txt">Oct 2026</span>
        <button class="btn-next-m">▶</button>
      </div>

      <div class="summary-bar">
        <div class="summary-item-box"><div>Income</div><div>£ 0.00</div></div>
        <div class="summary-item-box"><div>Expense</div><div class="total-exp-txt">£ 0.00</div></div>
        <div class="summary-item-box"><div>Total</div><div class="net-total-txt">-£ 0.00</div></div>
      </div>

      <div class="view-tabs">
        <div class="view-tab active" data-tab="daily">Daily</div>
        <div class="view-tab" data-tab="calendar">Calendar</div>
        <div class="view-tab" data-tab="monthly">Monthly</div>
        <div class="view-tab" data-tab="summary">Summary</div>
      </div>

      <div id="search-box" style="display:none; padding:8px; background:#fff; border-bottom:1px solid #e5e7eb;">
        <input type="text" id="search-input" class="form-control" placeholder="Search merchant or category...">
      </div>

      <div class="content-area">
        <div id="panel-daily" class="view-panel active"><div id="transaction-container"></div></div>
        <div id="panel-calendar" class="view-panel"><div class="cal-grid" id="calendar-container"></div></div>
        <div id="panel-monthly" class="view-panel"><div id="monthly-container" style="padding:12px;"></div></div>
        <div id="panel-summary" class="view-panel"><div id="summary-container"></div></div>
      </div>
    </div>

    <div id="screen-stats" class="main-screen">
      <div class="top-bar">
        <h1>Statistics</h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-stats-sync" title="Sync Cloud">🔄</button>
        </div>
      </div>
      <div class="month-nav">
        <button class="btn-prev-m">◀</button>
        <span class="current-month-txt">Oct 2026</span>
        <button class="btn-next-m">▶</button>
      </div>
      <div class="content-area">
        <div class="stats-container">
          <div class="pie-chart"><svg id="svgPie" viewBox="0 0 32 32" style="width:100%;height:100%;transform:rotate(-90deg);"></svg></div>
          <div id="stats-list-container" style="width:100%;"></div>
        </div>
      </div>
    </div>

    <button class="fab" id="add-fab">+</button>

    <div class="bottom-nav">
      <button class="nav-item active" id="nav-trans"><span>📝</span><span>Transaction</span></button>
      <button class="nav-item" id="nav-stats"><span>📊</span><span>Stats</span></button>
    </div>

    <div class="modal" id="entry-modal">
      <div class="modal-content">
        <div class="modal-header">
          <button class="icon-btn" style="color:#333;font-size:14px;" id="close-modal-top">Cancel</button>
          <span id="modal-title">Expense</span>
          <button class="icon-btn" style="color:#ef4444;font-size:14px;display:none;" id="delete-btn">Delete</button>
        </div>

        <div style="display:flex; gap:8px;">
          <div class="form-group" style="flex:1;">
            <label>Date</label>
            <input type="date" id="input-date" class="form-control">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Category</label>
            <input type="text" id="input-category" class="form-control" readonly style="cursor:pointer;" value="Food">
          </div>
        </div>

        <div class="form-group">
          <label>Merchant / Note</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="input-merchant" class="form-control" list="merchant-list" placeholder="e.g. Tesco, Starbucks" style="flex:1;">
            <button type="button" id="btn-clear-merchant" class="form-control" style="width:auto; background:#f3f4f6; border:1px solid #d1d5db; cursor:pointer;" title="Hide from suggestions">🚫[...]</textarea>
