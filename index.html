<!DOCTYPE html>
<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->

  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#FF5252',
            brandDark: '#E03E3E',
            incomeBlue: '#2196F3',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Global fixes for mobile tap and touch highlights */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;

    input, select, textarea {
      user-select: text;
    }
    /* Hide scrollbars for slick look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Active feedback for touch */

      transform: scale(0.96);

<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-start items-center p-0 m-0">

  <!-- Mobile Frame Container (centered on desktop, native width on mobile) -->

    <!-- 1. TOP HEADER BAR -->

      <button class="p-2 text-gray-700 hover:text-gray-900 rounded-full btn-active focus:outline-none" aria-label="Search">

        </button>

      </button>

            <option value="Car">Car</option>

            <option value="Subscriptions">Subscriptions</option>
            <option value="Shopping">Shopping</option>

            <option value="Other">Other</option>

      <!-- Interactive On-Screen Calculator Keypad -->

        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key="9">9</button>

        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key="4">4</button>
        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key="5">5</button>
        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key="6">6</button>
        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key=".">.</button>

        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200" data-key="1">1</button>

        </button>

        <button type="button" class="keypad-btn bg-white py-3.5 flex items-center justify-center hover:bg-gray-50 active:bg-gray-200 col-span-2" data-key="0">0</button>
        <button type="button" id="keypad-ok-btn" class="bg-brand text-white font-bold py-3.5 flex items-center justify-center hover:bg-brandDark active:opacity-90 col-span-2 text-base tracking-wider">
          OK

    </div>

  </div>

  <script>
    // --- 8. SUPABASE CLIENT CONFIGURATION ---
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ';
    
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(err) {
      console.warn("Supabase initialization failed or offline fallback activated:", err);
    }

    // State Variables
    let expensesList = [];
    let currentCalcExpr = "";
    let selectedType = "Expense";

    // --- DOM ELEMENT REFERENCES ---
    const appRoot = document.getElementById('app-root');
    const transactionContainer = document.getElementById('transaction-container');
    const addFabBtn = document.getElementById('add-fab-btn');
    const entryModal = document.getElementById('entry-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalCloseX = document.getElementById('modal-close-x');
    const fieldAmount = document.getElementById('field-amount');
    const fieldDate = document.getElementById('field-date');
    const fieldCategory = document.getElementById('field-category');
    const fieldMerchant = document.getElementById('field-merchant');
    const fieldAccount = document.getElementById('field-account');
    const fieldNote = document.getElementById('field-note');
    const keypadOkBtn = document.getElementById('keypad-ok-btn');
    const keypadBackspace = document.getElementById('keypad-backspace');

    // Header Summary Elements
    const headerIncome = document.getElementById('header-income');
    const headerExpense = document.getElementById('header-expense');
    const headerTotal = document.getElementById('header-total');

    // Default Date Setup
    const todayISO = new Date().toISOString().split('T')[0];

    // --- DATA FETCHING & RENDERING ---
    async function loadExpensesData() {
      if (!supabaseClient) {
        renderUIWithData([]);
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('expenses')
          .select('*')
          .order('date', { ascending: false });

        if (error) throw error;
        expensesList = data || [];
        renderUIWithData(expensesList);
        updateMerchantSuggestions();
      } catch (err) {
        console.error("Error fetching data from Supabase:", err);
        renderUIWithData(expensesList);
      }
    }

    function renderUIWithData(items) {
      transactionContainer.innerHTML = '';

      if (!items || items.length === 0) {
        transactionContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 px-4 text-center">
            <div class="w-16 h-16 bg-gray-200 text-gray-400 rounded-full flex items-center justify-center mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <p class="text-sm font-semibold text-gray-600">No transactions recorded</p>
            <p class="text-xs text-gray-400 mt-1">Tap the red plus (+) button below to add your first expense.</p>
          </div>
        `;
        headerIncome.textContent = "£0.00";
        headerExpense.textContent = "£0.00";
        headerTotal.textContent = "£0.00";
        return;
      }

      let totalIncomeVal = 0;
      let totalExpenseVal = 0;

      // Group entries by date
      const groupedByDate = {};
      items.forEach(item => {
        const amt = parseFloat(item.amount) || 0;
        if (item.type === 'Income') {
          totalIncomeVal += amt;
        } else {
          totalExpenseVal += amt;
        }

        const dateKey = item.date || 'Undated';
        if (!groupedByDate[dateKey]) groupedByDate[dateKey] = [];
        groupedByDate[dateKey].push(item);
      });

      // Update Summary Header Banner
      headerIncome.textContent = `£${totalIncomeVal.toFixed(2)}`;
      headerExpense.textContent = `£${totalExpenseVal.toFixed(2)}`;
      const netVal = totalIncomeVal - totalExpenseVal;
      headerTotal.textContent = `${netVal < 0 ? '-' : ''}£${Math.abs(netVal).toFixed(2)}`;

      // Build DOM for grouped transactions
      Object.keys(groupedByDate).sort().reverse().forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const dayNum = isNaN(dateObj.getDate()) ? '--' : dateObj.getDate();
        const dayName = isNaN(dateObj.getDay()) ? '' : dateObj.toLocaleDateString('en-US', { weekday: 'short' });

        const dayTotal = groupedByDate[dateStr].reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0);

        const groupDiv = document.createElement('div');
        groupDiv.className = "bg-white mb-2 border-y border-gray-200/80 shadow-sm";

        let dayHeaderHtml = `
          <div class="flex justify-between items-center px-4 py-2 bg-gray-50 border-b border-gray-100 text-xs">
            <div class="flex items-center space-x-1.5">
              <span class="text-base font-bold text-gray-900">${dayNum}</span>
              <span class="bg-gray-400 text-white text-[10px] px-1.5 py-0.5 rounded font-medium">${dayName}</span>
            </div>
            <span class="font-bold text-brand text-xs">£${dayTotal.toFixed(2)}</span>
          </div>
        `;

        let rowsHtml = '';
        groupedByDate[dateStr].forEach(entry => {
          rowsHtml += `
            <div class="flex justify-between items-center px-4 py-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
              <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400 w-16 truncate font-medium">${entry.category || 'Expense'}</span>
                <div class="flex flex-col">
                  <span class="text-sm font-semibold text-gray-900 leading-snug">${escapeHtml(entry.merchant || 'Expense')}</span>
                  <span class="text-[11px] text-gray-400 font-normal">${entry.account || 'Credit Cards'}</span>
                </div>
              </div>
              <span class="text-sm font-bold text-brand">£${parseFloat(entry.amount || 0).toFixed(2)}</span>
            </div>
          `;
        });

        groupDiv.innerHTML = dayHeaderHtml + rowsHtml;
        transactionContainer.appendChild(groupDiv);
      });
    }

    function updateMerchantSuggestions() {
      const datalist = document.getElementById('merchant-list-options');
      if (!datalist) return;
      const merchants = [...new Set(expensesList.map(e => e.merchant).filter(Boolean))];
      datalist.innerHTML = merchants.map(m => `<option value="${escapeHtml(m)}">`).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // --- MODAL CONTROLS ---
    function openEntryModal() {
      currentCalcExpr = "";
      fieldAmount.value = "";
      fieldDate.value = todayISO;
      fieldMerchant.value = "";
      fieldNote.value = "";
      fieldCategory.value = "Food";
      fieldAccount.value = "Credit Cards";
      entryModal.classList.remove('hidden');
    }

    function closeEntryModal() {
      entryModal.classList.add('hidden');
    }

    // Explicit Event Handling for Mobile & Desktop
    addFabBtn.addEventListener('click', openEntryModal);
    addFabBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openEntryModal(); }, {passive: false});

    modalCancelBtn.addEventListener('click', closeEntryModal);
    modalCloseX.addEventListener('click', closeEntryModal);

    // --- CALCULATOR KEYPAD LOGIC ---
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      const handler = (e) => {
        if (e) e.preventDefault();
        const key = btn.getAttribute('data-key');
        handleKeypadInput(key);
      };
      btn.addEventListener('click', handler);
      btn.addEventListener('touchstart', handler, {passive: false});
    });

    function handleKeypadInput(key) {
      if (['+', '-', '*', '/'].includes(key)) {
        if (currentCalcExpr !== "" && !['+', '-', '*', '/'].includes(currentCalcExpr.slice(-1))) {
          currentCalcExpr += key;
        }
      } else if (key === '=') {
        evaluateCalcExpression();
      } else {
        currentCalcExpr += key;
      }
      fieldAmount.value = currentCalcExpr;
    }

    function evaluateCalcExpression() {
      if (!currentCalcExpr) return;
      try {
        // Safe evaluation for basic math
        const sanitized = currentCalcExpr.replace(/[^0-9+\-*/.]/g, '');
        const res = Function(`'use strict'; return (${sanitized})`)();
        currentCalcExpr = isNaN(res) ? "" : String(parseFloat(res.toFixed(2)));
        fieldAmount.value = currentCalcExpr;
      } catch (e) {
        // In case of syntax error in expression
      }
    }

    keypadBackspace.addEventListener('click', handleBackspace);
    keypadBackspace.addEventListener('touchstart', (e) => { e.preventDefault(); handleBackspace(); }, {passive: false});

    function handleBackspace() {
      currentCalcExpr = currentCalcExpr.slice(0, -1);
      fieldAmount.value = currentCalcExpr;
    }

    // TYPE SWITCHER TABS
    document.querySelectorAll('.type-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.type-tab').forEach(t => {
          t.classList.remove('bg-brand', 'text-white');
          t.classList.add('bg-white', 'text-brand');
        });
        tab.classList.remove('bg-white', 'text-brand');
        tab.classList.add('bg-brand', 'text-white');
        selectedType = tab.getAttribute('data-type');
        document.getElementById('modal-title').textContent = selectedType;
      });
    });

    // --- SAVE TRANSACTION TO SUPABASE ---
    async function saveTransaction() {
      evaluateCalcExpression();
      const numVal = parseFloat(currentCalcExpr);

      if (isNaN(numVal) || numVal <= 0) {
        showToast("Please enter a valid amount.");
        return;
      }

      const newEntry = {
        merchant: fieldMerchant.value.trim() || 'Expense',
        amount: numVal,
        category: fieldCategory.value,
        account: fieldAccount.value,
        date: fieldDate.value || todayISO,
        type: selectedType,
        currency: '£'
      };

      // Optimistic UI update
      expensesList.unshift(newEntry);
      renderUIWithData(expensesList);
      closeEntryModal();

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('expenses').insert([newEntry]);
          if (error) throw error;
          loadExpensesData(); // Refresh clean state
        } catch (err) {
          console.error("Failed to save to database:", err);
          showToast("Saved locally. Supabase error: " + err.message);
        }
      }
    }

    keypadOkBtn.addEventListener('click', saveTransaction);
    keypadOkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); saveTransaction(); }, {passive: false});

    // View tab switching visual effect
    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.view-tab').forEach(t => {
          t.classList.remove('border-brand', 'text-brand', 'font-bold');
          t.classList.add('border-transparent', 'text-gray-500');
        });
        tab.classList.remove('border-transparent', 'text-gray-500');
        tab.classList.add('border-brand', 'text-brand', 'font-bold');
      });
    });

    // Custom non-blocking notification banner
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 transition-opacity duration-300';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Initial Load
    window.onload = () => {
      loadExpensesData();
    };
  </script>
</body>
</html>
