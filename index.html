<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      margin: 0;
      padding: 16px;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { font-size: 28px; margin-bottom: 20px; text-align: center; }
    label { font-weight: bold; font-size: 22px; display: block; margin-top: 15px; }
    input, select, button {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      margin-top: 8px;
      border-radius: 8px;
      border: 2px solid #ccc;
      box-sizing: border-box;
    }
    input[type="checkbox"] { width: 24px; height: 24px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
    .checkbox-group label { margin-top: 0; }
    button.submit-btn {
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }
    .expense-card {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .expense-amount { font-size: 24px; font-weight: bold; color: #111827; }
    .delete-btn {
      background: none;
      border: none;
      color: #dc2626;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      width: auto;
      padding: 0;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Currency Selection -->
    <div>
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="£">£ (GBP)</option>
        <option value="$">$ (USD)</option>
        <option value="€">€ (EUR)</option>
      </select>
    </div>

    <!-- Expense Entry Form -->
    <form id="expense-form">
      <label for="merchant">Merchant / Shop</label>
      <input type="text" id="merchant" list="merchant-list" placeholder="e.g. Costco, Tesco" required>
      <datalist id="merchant-list"></datalist>

      <label for="amount">Amount</label>
      <input type="number" step="0.01" id="amount" placeholder="0.00" required>

      <label for="category">Category</label>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Household (Electric/Water)">Household (Electric/Water)</option>
        <option value="Car/Petrol">Car/Petrol</option>
        <option value="Subscriptions">Subscriptions</option>
        <option value="Other">Other</option>
      </select>

      <div class="checkbox-group">
        <input type="checkbox" id="recurring">
        <label for="recurring">Monthly Regular</label>
      </div>

      <button type="submit" class="submit-btn">Save Expense</button>
    </form>

    <h2 style="margin-top: 30px;">Recent Entries</h2>
    <div id="expense-list"></div>
  </div>

  <script>
    // Paste your Supabase URL & Key below
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let expenses = [];

    async function loadExpenses() {
      const { data, error } = await supabase.from('expenses').select('*').order('date', { ascending: false });
      if (!error && data) {
        expenses = data;
        renderList();
        updateAutoSuggest();
      }
    }

    function renderList() {
      const listEl = document.getElementById('expense-list');
      const currency = document.getElementById('currency').value;
      listEl.innerHTML = '';

      expenses.forEach(item => {
        const div = document.createElement('div');
        div.className = 'expense-card';
        div.innerHTML = `
          <div>
            <strong>${item.merchant}</strong>
            <div style="font-size: 16px; color: #666;">${item.category} • ${item.date}</div>
            ${item.is_recurring ? '<span style="font-size: 14px; background:#dbeafe; color:#1e40af; padding: 2px 6px; border-radius: 4px;">Monthly</span>' : ''}
          </div>
          <div style="text-align: right;">
            <div class="expense-amount">${item.currency || currency}${parseFloat(item.amount).toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteExpense('${item.id}')">Delete</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function updateAutoSuggest() {
      const datalist = document.getElementById('merchant-list');
      const uniqueMerchants = [...new Set(expenses.map(e => e.merchant))];
      datalist.innerHTML = uniqueMerchants.map(m => `<option value="${m}">`).join('');
    }

    async function deleteExpense(id) {
      await supabase.from('expenses').delete().eq('id', id);
      loadExpenses();
    }

    document.getElementById('expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const merchant = document.getElementById('merchant').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const is_recurring = document.getElementById('recurring').checked;
      const currency = document.getElementById('currency').value;

      await supabase.from('expenses').insert([{
        merchant, amount, category, is_recurring, currency,
        date: new Date().toISOString().split('T')[0]
      }]);

      document.getElementById('merchant').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('recurring').checked = false;
      loadExpenses();
    });

    document.getElementById('currency').addEventListener('change', renderList);

    // Initial load
    loadExpenses();
  </script>
</body>
</html>
