<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ExpenseTracker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .app-container { width: 100%; max-width: 480px; background: #fff; height: 100%; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    #auth-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:#fff; z-index:999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
    #auth-screen h2 { margin-bottom: 20px; color: #10b981; }
    .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .auth-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .auth-btn:disabled { background: #a7f3d0; cursor: not-allowed; }
    .auth-error { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    .top-bar { background: #10b981; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .top-actions { display: flex; gap: 12px; align-items: center; }
    .icon-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    .month-nav { background: #059669; color: white; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
    .month-nav button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 0 8px; }
    .summary-bar { background: #ecfdf5; padding: 10px 16px; display: flex; justify-content: space-around; border-bottom: 1px solid #e5e7eb; font-size: 13px; text-align: center; }
    .summary-item-box div:first-child { color: #6b7280; font-size: 11px; }
    .summary-item-box div:last-child { font-weight: 600; color: #111827; margin-top: 2px; }
    .view-tabs { display: flex; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    .view-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500; color: #4b5563; cursor: pointer; border-bottom: 2px solid transparent; }
    .view-tab.active { color: #10b981; border-bottom-color: #10b981; background: #fff; }
    .main-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .main-screen.active { display: flex; }
    .content-area { flex: 1; overflow-y: auto; background: #f9fafb; padding-bottom: 80px; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .day-group { margin-bottom: 12px; background: #fff; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; }
    .day-header { padding: 8px 16px; background: #f3f4f6; display: flex; justify-content: space-between; font-size: 12px; color: #4b5563; }
    .trans-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
    .trans-row:active { background: #f9fafb; }
    .trans-left { display: flex; flex-direction: column; gap: 2px; }
    .trans-category { font-size: 11px; background: #e5e7eb; padding: 2px 6px; border-radius: 4px; width: fit-content; color: #374151; font-weight: 500; }
    .trans-details strong { font-size: 14px; color: #111827; }
    .trans-amount { font-size: 15px; font-weight: 600; color: #ef4444; }
    .fab { position: absolute; bottom: 75px; right: 20px; width: 56px; height: 56px; background: #10b981; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 300; box-shadow: 0 8px 20px rgba(16,185,129,.35); border: none; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #9ca3af; cursor: pointer; width: 50%; }
    .nav-item.active { color: #10b981; font-weight: 600; }
    .nav-item span:first-child { font-size: 20px; }
    .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; justify-content: flex-end; flex-direction: column; }
    .modal-content { background: #fff; width: 100%; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 16px; display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 600; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .key-btn { padding: 14px; background: #f3f4f6; border: none; border-radius: 8px; font-size: 18px; font-weight: 500; cursor: pointer; text-align: center; color: #1f2937; }
    .key-btn:active { background: #e5e7eb; }
    .key-btn.ok { background: #10b981; color: white; grid-row: span 2; height: 100%; display: flex; align-items: center; justify-content: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #e5e7eb; padding: 2px; }
    .cal-day-name { background: #f3f4f6; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 600; color: #4b5563; }
    .cal-cell { background: #fff; min-height: 60px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; }
    .cal-cell.empty { background: #fafafa; }
    .cal-date-num { font-size: 11px; font-weight: 500; color: #374151; }
    .cal-spend { font-size: 10px; color: #ef4444; font-weight: 600; text-align: right; }
    .summary-item { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f3f4f6; }
    .summary-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .progress-bg { background: #f3f4f6; height: 6px; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .stats-container { padding: 16px; background: #fff; display: flex; flex-direction: column; align-items: center; }
    .pie-chart { width: 160px; height: 160px; border-radius: 50%; margin: 16px 0; position: relative; }
    .stats-row { width: 100%; display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
    .badge-percent { padding: 2px 6px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; }
    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
    .cat-tile { background: #f3f4f6; padding: 12px; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .cat-tile:active { background: #e5e7eb; }
    .cat-tile span { font-size: 20px; }
    .cat-tile.add-tile { background: #ecfdf5; color: #10b981; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="auth-screen">
      <h2>ExpenseTracker Login</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      <button id="btn-login" class="auth-btn">Sign In</button>
      <div id="auth-error" class="auth-error"></div>
    </div>

    <div id="screen-trans" class="main-screen active">
      <div class="top-bar">
        <h1>ExpenseTracker</h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-search" title="Search">🔍</button>
          <label class="icon-btn" title="Import Excel/CSV" style="cursor:pointer;">📂<input type="file" id="import-file-input" accept=".xlsx, .xls, .csv" style="display:none;"></label>
          <button class="icon-btn" id="btn-export-excel" title="Export CSV">📥</button>
          <button class="icon-btn" id="btn-sync" title="Sync Cloud">🔄</button>
          <button class="icon-btn" id="btn-logout" title="Logout">🚪</button>
        </div>
      </div>

      <div class="month-nav">
        <button class="btn-prev-m">◀</button>
        <span class="current-month-txt">Oct 2026</span>
        <button class="btn-next-m">▶</button>
      </div>

      <div class="summary-bar">
        <div class="summary-item-box"><div>Income</div><div>£ 0.00</div></div>
        <div class="summary-item-box"><div>Expense</div><div class="total-exp-txt">£ 0.00</div></div>
        <div class="summary-item-box"><div>Total</div><div class="net-total-txt">-£ 0.00</div></div>
      </div>

      <div class="view-tabs">
        <div class="view-tab active" data-tab="daily">Daily</div>
        <div class="view-tab" data-tab="calendar">Calendar</div>
        <div class="view-tab" data-tab="monthly">Monthly</div>
        <div class="view-tab" data-tab="summary">Summary</div>
      </div>

      <div id="search-box" style="display:none; padding:8px; background:#fff; border-bottom:1px solid #e5e7eb;">
        <input type="text" id="search-input" class="form-control" placeholder="Search merchant or category...">
      </div>

      <div class="content-area">
        <div id="panel-daily" class="view-panel active"><div id="transaction-container"></div></div>
        <div id="panel-calendar" class="view-panel"><div class="cal-grid" id="calendar-container"></div></div>
        <div id="panel-monthly" class="view-panel"><div id="monthly-container" style="padding:12px;"></div></div>
        <div id="panel-summary" class="view-panel"><div id="summary-container"></div></div>
      </div>
    </div>

    <div id="screen-stats" class="main-screen">
      <div class="top-bar">
        <h1>Statistics</h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-stats-sync" title="Sync Cloud">🔄</button>
        </div>
      </div>
      <div class="month-nav">
        <button class="btn-prev-m">◀</button>
        <span class="current-month-txt">Oct 2026</span>
        <button class="btn-next-m">▶</button>
      </div>
      <div class="content-area">
        <div class="stats-container">
          <div class="pie-chart"><svg id="svgPie" viewBox="0 0 32 32" style="width:100%;height:100%;transform:rotate(-90deg);"></svg></div>
          <div id="stats-list-container" style="width:100%;"></div>
        </div>
      </div>
    </div>

    <button class="fab" id="add-fab">+</button>

    <div class="bottom-nav">
      <button class="nav-item active" id="nav-trans"><span>📝</span><span>Transaction</span></button>
      <button class="nav-item" id="nav-stats"><span>📊</span><span>Stats</span></button>
    </div>

    <div class="modal" id="entry-modal">
      <div class="modal-content">
        <div class="modal-header">
          <button class="icon-btn" style="color:#333;font-size:14px;" id="close-modal-top">Cancel</button>
          <span id="modal-title">Expense</span>
          <button class="icon-btn" style="color:#ef4444;font-size:14px;display:none;" id="delete-btn">Delete</button>
        </div>

        <div style="display:flex; gap:8px;">
          <div class="form-group" style="flex:1;">
            <label>Date</label>
            <input type="date" id="input-date" class="form-control">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Category</label>
            <input type="text" id="input-category" class="form-control" readonly style="cursor:pointer;" value="Food">
          </div>
        </div>

        <div class="form-group">
          <label>Merchant / Note</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="input-merchant" class="form-control" list="merchant-list" placeholder="e.g. Tesco, Starbucks" style="flex:1;">
            <button type="button" id="btn-clear-merchant" class="form-control" style="width:auto; background:#f3f4f6; border:1px solid #d1d5db; cursor:pointer;" title="Hide from suggestions">🚫</button>
          </div>
          <datalist id="merchant-list"></datalist>
        </div>

        <div class="form-group">
          <label>Amount (£)</label>
          <input type="text" id="input-amount" class="form-control" placeholder="0.00" readonly style="font-size:20px; font-weight:600; text-align:right;">
        </div>

        <div class="keypad">
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key="+">+</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="-">-</button>
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn ok" id="key-ok" data-key="null">OK</button>
          <button class="key-btn" data-key=".">.</button>
          <button class="key-btn" data-key="0">0</button>
          <button class="key-btn" id="key-backspace" data-key="null">⌫</button>
        </div>
      </div>
    </div>

    <div class="modal" id="category-modal" style="z-index: 150;">
      <div class="modal-content" style="height:60vh;">
        <div class="modal-header">
          <span>Select Category</span>
          <button class="icon-btn" style="color:#333;font-size:14px;" id="close-cat-modal">Close</button>
        </div>
        <div class="cat-grid" id="cat-grid-container"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_s[...' ;

    let expenses = [];
    let accessToken = localStorage.getItem('sb_access_token') || null;
    let currentUserEmail = (localStorage.getItem('sb_user_email') || '').toLowerCase().trim();
    let currentUserId = localStorage.getItem('sb_user_id') || null;
    let editingId = null;
    let currentDate = new Date();

    const baseCategories = ['Food', 'Social Life', 'Self-development', 'Transportation', 'Culture', 'Household', 'Apparel', 'Beauty', 'Health', 'Education', 'Gift', 'Other', 'Clothing', 'Car', 'Rent', 'Phone', 'Toys', 'Council Tax', 'Donation'];
    let customCategories = JSON.parse(localStorage.getItem('custom_categories') || '[]');
    let hiddenMerchants = JSON.parse(localStorage.getItem('hidden_merchants') || '[]');

    const categoryColors = {
      'Food': '#ff6384', 'Social Life': '#ff9f40', 'Self-development': '#ffcd56',
      'Transportation': '#4bc0c0', 'Culture': '#36a2eb', 'Household': '#9966ff',
      'Apparel': '#c9cbcf', 'Beauty': '#e7e9ed', 'Health': '#2ecc71',
      'Education': '#e74c3c', 'Gift': '#3498db', 'Other': '#95a5a6',
      'Clothing': '#9b59b6', 'Car': '#1abc9c', 'Rent': '#f39c12',
      'Phone': '#d35400', 'Toys': '#f1c40f', 'Council Tax': '#e67e22', 'Donation': '#16a085'
    };

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(window.atob(base64));
      } catch (e) {
        return null;
      }
    }

    function getUserStorageKey() {
      if (currentUserId) return `expenses_data_${currentUserId}`;
      if (currentUserEmail) return `expenses_data_${currentUserEmail}`;
      return 'expenses_data_guest';
    }

    function saveAuthState() {
      if (accessToken) localStorage.setItem('sb_access_token', accessToken);
      if (currentUserEmail) localStorage.setItem('sb_user_email', currentUserEmail);
      if (currentUserId) localStorage.setItem('sb_user_id', currentUserId);
    }

    function clearAuthState() {
      localStorage.removeItem('sb_access_token');
      localStorage.removeItem('sb_user_email');
      localStorage.removeItem('sb_user_id');
    }

    if (accessToken) {
      const payload = parseJwt(accessToken);
      if (payload && payload.sub) currentUserId = payload.sub;
      if (currentUserId) saveAuthState();
    }

    async function login() {
      const emailInput = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errEl = document.getElementById('auth-error');
      const btnLogin = document.getElementById('btn-login');

      errEl.innerText = "";
      if (!emailInput || !password) {
        errEl.innerText = "Please enter email and password.";
        return;
      }

      btnLogin.innerText = "Signing in...";
      btnLogin.disabled = true;

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput, password })
        });
        const data = await res.json();

        btnLogin.innerText = "Sign In";
        btnLogin.disabled = false;

        if (res.ok && data.access_token) {
          accessToken = data.access_token;
          currentUserEmail = emailInput.toLowerCase().trim();

          const payload = parseJwt(accessToken);
          currentUserId = payload && payload.sub ? payload.sub : null;
          saveAuthState();

          document.getElementById('auth-screen').style.display = 'none';
          await syncWithSupabase();
          loadLocalForUser();
          renderAllViews();
        } else {
          errEl.innerText = data.error_description || data.msg || data.message || "Invalid login credentials.";
        }
      } catch (e) {
        btnLogin.innerText = "Sign In";
        btnLogin.disabled = false;
        errEl.innerText = "Connection error during login.";
        console.error('Login Error:', e);
      }
    }

    function logout() {
      accessToken = null;
      currentUserEmail = null;
      currentUserId = null;
      expenses = [];
      clearAuthState();
      document.getElementById('auth-screen').style.display = 'flex';
    }

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('auth-password').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    document.getElementById('btn-logout').addEventListener('click', logout);

    if (accessToken && currentUserId) {
      document.getElementById('auth-screen').style.display = 'none';
      loadLocalForUser();
      syncWithSupabase();
    }

    function loadLocalForUser() {
      const storageKey = getUserStorageKey();
      const stored = localStorage.getItem(storageKey);
      expenses = stored ? JSON.parse(stored) : [];
      updateMonthHeader();
      updateAutoSuggest();
    }

    async function saveLocalAndSupabase(item) {
      if (!currentUserEmail || !currentUserId) return;
      item.user_id = currentUserId;

      const index = expenses.findIndex(e => e.id === item.id);
      if (index >= 0) expenses[index] = item;
      else expenses.unshift(item);

      localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
      renderAllViews();
      updateAutoSuggest();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/expenses`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(item)
        });

        if (!res.ok) {
          const errData = await res.json();
          console.error('Supabase Save Error:', errData);
        } else {
          await syncWithSupabase();
        }
      } catch (e) {
        console.error('Cloud save network failure', e);
      }
    }

    async function deleteFromLocalAndSupabase(id) {
      expenses = expenses.filter(e => e.id !== id);
      localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
      renderAllViews();
      updateAutoSuggest();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/expenses?id=eq.${id}&user_id=eq.${currentUserId}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${accessToken}`
          }
        });

        if (!res.ok) {
          console.error('Cloud delete failure', await res.text());
        } else {
          await syncWithSupabase();
        }
      } catch (e) {
        console.error('Cloud delete failure', e);
      }
    }

    async function syncWithSupabase() {
      if (!accessToken || !currentUserId) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/expenses?user_id=eq.${currentUserId}&select=*&order=date.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${accessToken}` }
        });

        if (res.ok) {
          const cloudData = await res.json();
          if (Array.isArray(cloudData)) {
            expenses = cloudData
              .map(item => ({ ...item, user_id: currentUserId }))
              .sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
            updateMonthHeader();
            updateAutoSuggest();
            return;
          }
        }

        if (res.status === 401 || res.status === 403) {
          logout();
          return;
        }

        const localKey = getUserStorageKey();
        const localStored = localStorage.getItem(localKey);
        if (localStored) {
          expenses = JSON.parse(localStored);
          updateMonthHeader();
          updateAutoSuggest();
        }
      } catch (e) {
        console.error('Sync error', e);
      }
    }

    document.getElementById('import-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (rows.length < 2) {
            alert('The file appears to be empty.');
            return;
          }

          let importedCount = 0;
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;

            let dateStr = r[0] ? String(r[0]).trim() : new Date().toISOString().split('T')[0];
            if (!isNaN(dateStr) && Number(dateStr) > 30000) {
              const d = new Date((dateStr - (25567 + 2)) * 86400 * 1000);
              dateStr = d.toISOString().split('T')[0];
            }

            const category = r[1] ? String(r[1]).trim() : 'Other';
            const merchant = r[2] ? String(r[2]).replace(/['"]+/g, '').trim() : 'Imported';
            const amount = r[3] !== undefined ? parseFloat(r[3]) || 0 : 0;
            const currency = r[4] ? String(r[4]).trim() : '£';

            if (amount > 0) {
              const newItem = {
                id: 'imp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                user_id: currentUserId,
                date: dateStr.substring(0, 10),
                category: category,
                merchant: merchant,
                amount: amount,
                currency: currency,
                repeat: 'none'
              };
              expenses.unshift(newItem);
              importedCount++;
            }
          }

          if (importedCount > 0) {
            localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
            updateMonthHeader();

            for (let item of expenses.slice(0, importedCount)) {
              await fetch(`${SUPABASE_URL}/rest/v1/expenses`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${accessToken}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates'
                },
                body: JSON.stringify(item)
              });
            }

            await syncWithSupabase();
            alert(`Successfully imported ${importedCount} records!`);
          } else {
            alert('No valid expense rows found to import.');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to parse the file.');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('btn-export-excel').addEventListener('click', () => {
      if (!expenses || expenses.length === 0) {
        alert('No records available to export.');
        return;
      }

      let csvContent = 'data:text/csv;charset=utf-8,Period,Category,Note,Amount,Currency\r\n';
      expenses.forEach(e => {
        let row = [e.date, e.category, `"${(e.merchant || '').replace(/"/g, '""')}"`, e.amount, e.currency || '£'];
        csvContent += row.join(',') + '\r\n';
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `expenses_export_${currentUserEmail || 'user'}_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    function updateMonthHeader() {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const txt = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
      document.querySelectorAll('.current-month-txt').forEach(el => el.innerText = txt);
      renderAllViews();
    }

    document.querySelectorAll('.btn-prev-m').forEach(btn => {
      btn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); updateMonthHeader(); });
    });

    document.querySelectorAll('.btn-next-m').forEach(btn => {
      btn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); updateMonthHeader(); });
    });

    document.getElementById('btn-search').addEventListener('click', () => {
      const box = document.getElementById('search-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      renderDaily(e.target.value.toLowerCase());
    });

    document.getElementById('btn-sync').addEventListener('click', async () => {
      await syncWithSupabase();
      alert('Synced with Supabase database!');
    });

    document.getElementById('btn-stats-sync').addEventListener('click', async () => {
      await syncWithSupabase();
      alert('Synced with Supabase database!');
    });

    document.getElementById('nav-trans').addEventListener('click', () => {
      document.getElementById('screen-trans').classList.add('active');
      document.getElementById('screen-stats').classList.remove('active');
      document.getElementById('nav-trans').classList.add('active');
      document.getElementById('nav-stats').classList.remove('active');
      renderAllViews();
    });

    document.getElementById('nav-stats').addEventListener('click', () => {
      document.getElementById('screen-stats').classList.add('active');
      document.getElementById('screen-trans').classList.remove('active');
      document.getElementById('nav-stats').classList.add('active');
      document.getElementById('nav-trans').classList.remove('active');
      renderStats();
    });

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.getAttribute('data-tab');
        document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${target}`).classList.add('active');
      });
    });

    function renderAllViews() {
      renderDaily();
      renderCalendar();
      renderMonthly();
      renderSummary();
      if (document.getElementById('screen-stats').classList.contains('active')) {
        renderStats();
      }
    }

    function filterByCurrentMonth() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;
      return expenses.filter(e => e.date && e.date.startsWith(prefix));
    }

    function renderDaily(searchTerm = '') {
      const container = document.getElementById('transaction-container');
      container.innerHTML = '';

      let filtered = filterByCurrentMonth();
      if (searchTerm) {
        filtered = filtered.filter(e => (e.merchant && e.merchant.toLowerCase().includes(searchTerm)) || (e.category && e.category.toLowerCase().includes(searchTerm)));
      }

      let totalExp = filtered.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
      document.querySelectorAll('.total-exp-txt').forEach(el => el.innerText = '£ ' + totalExp.toFixed(2));
      document.querySelectorAll('.net-total-txt').forEach(el => el.innerText = '-£ ' + totalExp.toFixed(2));

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No transactions recorded for this month.<br>Tap + to add one.</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(item => {
        const dateKey = item.date;
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push(item);
      });

      Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const dayNum = dateObj.getDate();
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        let dayTotal = grouped[dateStr].reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);

        let groupHtml = `
          <div class="day-group">
            <div class="day-header">
              <div><strong>${dayNum}</strong> <span style="background:#888;color:#fff;padding:1px 4px;border-radius:3px;font-size:10px;">${dayName}</span></div>
              <div style="color: #ef4444; font-weight: 600;">£ ${dayTotal.toFixed(2)}</div>
            </div>
        `;

        grouped[dateStr].forEach(item => {
          groupHtml += `
            <div class="trans-row" onclick="editExpense('${item.id}')">
              <div class="trans-left">
                <span class="trans-category">${item.category}</span>
                <div class="trans-details">
                  <strong>${item.merchant || ''}</strong>
                </div>
              </div>
              <div class="trans-amount">£ ${parseFloat(item.amount || 0).toFixed(2)}</div>
            </div>
          `;
        });

        groupHtml += '</div>';
        container.innerHTML += groupHtml;
      });
    }

    function renderCalendar() {
      const cal = document.getElementById('calendar-container');
      cal.innerHTML = '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      days.forEach(d => cal.innerHTML += `<div class="cal-day-name">${d}</div>`);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const dateMap = {};
      filterByCurrentMonth().forEach(e => {
        const d = parseInt(e.date.split('-')[2]);
        dateMap[d] = (dateMap[d] || 0) + parseFloat(e.amount || 0);
      });

      for (let x = 0; x < firstDayIndex; x++) cal.innerHTML += '<div class="cal-cell empty"></div>';

      for (let i = 1; i <= daysInMonth; i++) {
        const spend = dateMap[i] ? `£${dateMap[i].toFixed(0)}` : '';
        cal.innerHTML += `
          <div class="cal-cell">
            <div class="cal-date-num">${i}</div>
            <div class="cal-spend">${spend}</div>
          </div>
        `;
      }
    }

    function renderMonthly() {
      const container = document.getElementById('monthly-container');
      container.innerHTML = '';
      const monthlyMap = {};

      expenses.forEach(e => {
        if (e.date) {
          const monthKey = e.date.substring(0, 7);
          monthlyMap[monthKey] = (monthlyMap[monthKey] || 0) + parseFloat(e.amount || 0);
        }
      });

      Object.keys(monthlyMap).sort().reverse().forEach(m => {
        const [y, mm] = m.split('-');
        const dObj = new Date(y, mm - 1, 1);
        const mLabel = dObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        container.innerHTML += `
          <div class="trans-row" style="background:#fff; margin-top:6px;" onclick="jumpToMonth(${y}, ${mm-1})">
            <div class="trans-left"><strong>${mLabel}</strong></div>
            <div class="trans-amount">£ ${monthlyMap[m].toFixed(2)}</div>
          </div>
        `;
      });
    }

    function jumpToMonth(y, m) {
      currentDate = new Date(y, m, 1);
      document.querySelectorAll('.view-tab')[0].click();
      updateMonthHeader();
    }

    function renderSummary() {
      const container = document.getElementById('summary-container');
      container.innerHTML = '';
      const filtered = filterByCurrentMonth();
      const catTotals = {};
      let total = 0;

      filtered.forEach(e => {
        const cat = e.category || 'Other';
        const amt = parseFloat(e.amount || 0);
        catTotals[cat] = (catTotals[cat] || 0) + amt;
        total += amt;
      });

      if (total === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No summary data for this month.</div>';
        return;
      }

      Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]).forEach(cat => {
        const amt = catTotals[cat];
        const pct = ((amt / total) * 100).toFixed(1);
        container.innerHTML += `
          <div class="summary-item">
            <div class="summary-label"><span>${cat}</span><span>£ ${amt.toFixed(2)} (${pct}%)</span></div>
            <div class="progress-bg"><div class="progress-fill" style="width: ${pct}%; background:${categoryColors[cat] || '#10b981'};"></div></div>
          </div>
        `;
      });
    }

    function renderStats() {
      const listContainer = document.getElementById('stats-list-container');
      listContainer.innerHTML = '';
      const filtered = filterByCurrentMonth();
      const catTotals = {};
      let total = 0;

      filtered.forEach(e => {
        const cat = e.category || 'Other';
        const amt = parseFloat(e.amount || 0);
        catTotals[cat] = (catTotals[cat] || 0) + amt;
        total += amt;
      });

      const svg = document.getElementById('svgPie');
      svg.innerHTML = '';

      if (total === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No stats available for this month.</div>';
        return;
      }

      let cumulativePercent = 0;
      Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]).forEach(cat => {
        const amt = catTotals[cat];
        const pct = (amt / total) * 100;
        const color = categoryColors[cat] || '#10b981';

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '16');
        circle.setAttribute('cy', '16');
        circle.setAttribute('r', '16');
        circle.setAttribute('fill', 'transparent');
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '32');
        circle.setAttribute('stroke-dasharray', `${pct} 100`);
        circle.setAttribute('stroke-dashoffset', -cumulativePercent);
        svg.appendChild(circle);

        cumulativePercent += pct;

        listContainer.innerHTML += `
          <div class="stats-row">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="badge-percent" style="background:${color};">${pct.toFixed(0)}%</div>
              <strong>${cat}</strong>
            </div>
            <div class="trans-amount">£ ${amt.toFixed(2)}</div>
          </div>
        `;
      });
    }

    function updateAutoSuggest() {
      const list = document.getElementById('merchant-list');
      list.innerHTML = '';
      const merchants = [...new Set(expenses.map(e => e.merchant).filter(Boolean))];
      merchants.forEach(m => {
        if (!hiddenMerchants.includes(m)) {
          list.innerHTML += `<option value="${m}">`;
        }
      });
    }

    const modal = document.getElementById('entry-modal');
    const catModal = document.getElementById('category-modal');

    function openModal(isEdit = false) {
      modal.style.display = 'flex';
      document.getElementById('delete-btn').style.display = isEdit ? 'block' : 'none';
    }

    function closeModal() {
      modal.style.display = 'none';
      catModal.style.display = 'none';
      editingId = null;
    }

    document.getElementById('add-fab').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modal-title').innerText = 'Expense';
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('input-amount').value = '';
      document.getElementById('input-category').value = 'Food';
      document.getElementById('input-merchant').value = '';
      openModal(false);
    });

    document.getElementById('close-modal-top').addEventListener('click', closeModal);

    window.editExpense = function(id) {
      const item = expenses.find(e => e.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('modal-title').innerText = 'Edit Expense';
      document.getElementById('input-date').value = item.date;
      document.getElementById('input-amount').value = item.amount;
      document.getElementById('input-category').value = item.category;
      document.getElementById('input-merchant').value = item.merchant || '';
      openModal(true);
    };

    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (editingId && confirm('Delete this transaction?')) {
        await deleteFromLocalAndSupabase(editingId);
        closeModal();
      }
    });

    document.getElementById('input-category').addEventListener('click', () => {
      const grid = document.getElementById('cat-grid-container');
      grid.innerHTML = '';
      const allCats = [...baseCategories, ...customCategories];
      allCats.forEach(c => {
        grid.innerHTML += `<div class="cat-tile" onclick="selectCategory('${c}')"><span>📁</span>${c}</div>`;
      });
      grid.innerHTML += '<div class="cat-tile add-tile" onclick="addNewCategory()"><span>➕</span>Add</div>';
      catModal.style.display = 'flex';
    });

    document.getElementById('close-cat-modal').addEventListener('click', () => { catModal.style.display = 'none'; });

    window.selectCategory = function(c) {
      document.getElementById('input-category').value = c;
      catModal.style.display = 'none';
    };

    window.addNewCategory = function() {
      const name = prompt('Enter new category name:');
      if (name && name.trim()) {
        const c = name.trim();
        if (!baseCategories.includes(c) && !customCategories.includes(c)) {
          customCategories.push(c);
          localStorage.setItem('custom_categories', JSON.stringify(customCategories));
        }
        selectCategory(c);
      }
    };

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        const input = document.getElementById('input-amount');

        if (key === null || key === 'null') {
          if (btn.id === 'key-backspace') {
            input.value = input.value.slice(0, -1);
          } else if (btn.id === 'key-ok') {
            saveEntry();
          }
          return;
        }

        if (['+', '-', '*', '/'].includes(key)) {
          input.value += ` ${key} `;
        } else if (key === '=') {
          try {
            input.value = eval(input.value.replace(/×/g, '*').replace(/÷/g, '/')) || '';
          } catch (e) {
            input.value = '';
          }
        } else {
          input.value += key;
        }
      });
    });

    async function saveEntry() {
      const date = document.getElementById('input-date').value;
      const rawAmount = document.getElementById('input-amount').value;
      let amount = 0;
      try {
        amount = eval(rawAmount.replace(/×/g, '*').replace(/÷/g, '/')) || 0;
      } catch (e) {
        amount = parseFloat(rawAmount) || 0;
      }

      if (!date || amount <= 0) {
        alert('Please enter a valid date and amount.');
        return;
      }

      const category = document.getElementById('input-category').value;
      const merchant = document.getElementById('input-merchant').value.trim();

      const item = {
        id: editingId || 'exp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        user_id: currentUserId,
        date: date,
        category: category,
        merchant: merchant,
        amount: amount,
        currency: '£',
        repeat: 'none'
      };

      await saveLocalAndSupabase(item);
      closeModal();
    }
  </script>
</body>
