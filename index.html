<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trans.</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f5f7; color: #333; max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 70px; }

    /* Top Navigation Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #eee; }
    .top-bar h2 { font-size: 18px; font-weight: 600; }
    .month-selector { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #fff; font-size: 16px; font-weight: 500; }
    
    /* Navigation Tabs */
    .view-tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .view-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; color: #888; cursor: pointer; }
    .view-tab.active { color: #ff5252; font-weight: bold; border-bottom: 2px solid #ff5252; }

    /* Income / Expense / Total Summary Header */
    .summary-header { display: flex; justify-content: space-around; background: #fafafa; padding: 10px 0; border-bottom: 1px solid #eee; text-align: center; }
    .summary-box label { font-size: 12px; color: #777; display: block; }
    .summary-box span { font-size: 14px; font-weight: 600; }
    .income-val { color: #2196f3; }
    .exp-val { color: #ff5252; }
    .total-val { color: #333; }

    /* Daily Transaction List */
    .day-group { margin-top: 10px; background: #fff; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
    .day-header { display: flex; justify-content: space-between; padding: 8px 16px; background: #fdfdfd; font-size: 13px; color: #666; border-bottom: 1px solid #f0f0f0; }
    .day-header strong { font-size: 16px; color: #111; margin-right: 4px; }
    .day-header span.day-tag { background: #888; color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 10px; }

    .trans-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f8f8f8; }
    .trans-left { display: flex; gap: 12px; align-items: center; }
    .trans-category { font-size: 12px; color: #999; width: 60px; }
    .trans-details strong { font-size: 15px; color: #222; display: block; }
    .trans-details span { font-size: 12px; color: #a0a0a0; }
    .trans-amount { font-size: 15px; font-weight: 600; color: #ff5252; }

    /* Floating Add Button */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: #ff5252; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 10px rgba(255,82,82,0.4); cursor: pointer; border: none; }

    /* Modal Form Overlay */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; flex-direction: column; z-index: 100; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; }
    .type-switcher { display: flex; width: 80%; margin: 10px auto; border: 1px solid #ff5252; border-radius: 6px; overflow: hidden; }
    .type-btn { flex: 1; text-align: center; padding: 8px 0; font-size: 14px; color: #ff5252; background: #fff; border: none; }
    .type-btn.active { background: #ff5252; color: #fff; }

    .form-fields { padding: 10px 20px; flex: 1; }
    .field-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 15px; }
    .field-row label { width: 80px; color: #888; }
    .field-row input, .field-row select { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; }
    .field-row input.amount-input { color: #ff5252; font-size: 20px; font-weight: bold; }

    /* Custom Keypad */
    .keypad-header { background: #000; color: #fff; display: flex; justify-content: space-between; padding: 10px 16px; font-size: 14px; }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); background: #f0f0f2; gap: 1px; }
    .key-btn { background: #fff; border: none; padding: 18px 0; font-size: 18px; font-weight: 500; cursor: pointer; text-align: center; }
    .key-btn:active { background: #e0e0e0; }
    .key-btn.ok-btn { background: #ff5252; color: #fff; grid-row: span 2; display: flex; justify-content: center; align-items: center; font-size: 18px; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-bar">
    <span>🔍</span>
    <h2>Trans.</h2>
    <span>⚙️</span>
  </div>

  <div class="month-selector">
    <span>‹</span>
    <span id="current-month-display">Oct 2026</span>
    <span>›</span>
  </div>

  <!-- View Mode Tabs -->
  <div class="view-tabs">
    <div class="view-tab active">Daily</div>
    <div class="view-tab">Calendar</div>
    <div class="view-tab">Monthly</div>
    <div class="view-tab">Summary</div>
  </div>

  <!-- Income / Exp / Total Header Banner -->
  <div class="summary-header">
    <div class="summary-box">
      <label>Income</label>
      <span class="income-val">0.00</span>
    </div>
    <div class="summary-box">
      <label>Exp.</label>
      <span class="exp-val" id="total-exp">0.00</span>
    </div>
    <div class="summary-box">
      <label>Total</label>
      <span class="total-val" id="net-total">0.00</span>
    </div>
  </div>

  <!-- Transaction List -->
  <div id="transaction-container"></div>

  <!-- Floating Add Button -->
  <button class="fab" onclick="openModal()">+</button>

  <!-- Add Expense Modal Screen -->
  <div class="modal" id="entry-modal">
    <div class="modal-header">
      <span onclick="closeModal()" style="font-size: 20px; cursor: pointer;">‹ Trans.</span>
      <h3 style="font-size: 16px;">Expense</h3>
      <span>⭐</span>
    </div>

    <div class="type-switcher">
      <button class="type-btn">Income</button>
      <button class="type-btn active">Expense</button>
      <button class="type-btn">Transfer</button>
    </div>

    <div class="form-fields">
      <div class="field-row">
        <label>Date</label>
        <input type="date" id="input-date">
      </div>
      <div class="field-row">
        <label>Amount</label>
        <input type="text" id="input-amount" class="amount-input" readonly placeholder="0.00">
      </div>
      <div class="field-row">
        <label>Category</label>
        <select id="input-category">
          <option value="Food">Food</option>
          <option value="Car">Car</option>
          <option value="Household">Household</option>
          <option value="Subscriptions">Subscriptions</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field-row">
        <label>Merchant</label>
        <input type="text" id="input-merchant" placeholder="Merchant/Shop (e.g., Tesco)" list="merchant-list">
        <datalist id="merchant-list"></datalist>
      </div>
      <div class="field-row">
        <label>Account</label>
        <select id="input-account">
          <option value="Credit Cards">Credit Cards</option>
          <option value="Debit Card">Debit Card</option>
          <option value="Cash">Cash</option>
        </select>
      </div>
    </div>

    <!-- Custom Keypad -->
    <div class="keypad-header">
      <span>Amount</span>
      <span onclick="closeModal()" style="cursor: pointer;">✕</span>
    </div>
    <div class="keypad">
      <button class="key-btn" onclick="keyInput('+')">+</button>
      <button class="key-btn" onclick="keyInput('-')">-</button>
      <button class="key-btn" onclick="keyInput('*')">×</button>
      <button class="key-btn" onclick="keyInput('/')">÷</button>

      <button class="key-btn" onclick="keyInput('7')">7</button>
      <button class="key-btn" onclick="keyInput('8')">8</button>
      <button class="key-btn" onclick="keyInput('9')">9</button>
      <button class="key-btn" onclick="keyInput('=')">=</button>

      <button class="key-btn" onclick="keyInput('4')">4</button>
      <button class="key-btn" onclick="keyInput('5')">5</button>
      <button class="key-btn" onclick="keyInput('6')">6</button>
      <button class="key-btn" onclick="keyInput('.')">.</button>

      <button class="key-btn" onclick="keyInput('1')">1</button>
      <button class="key-btn" onclick="keyInput('2')">2</button>
      <button class="key-btn" onclick="keyInput('3')">3</button>
      <button class="key-btn" onclick="keyBackspace()">⌫</button>

      <button class="key-btn" style="grid-column: span 2;" onclick="keyInput('0')">0</button>
      <button class="key-btn ok-btn" style="grid-column: span 2;" onclick="saveTransaction()">OK</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let expenses = [];
    let amountString = "";

    async function fetchExpenses() {
      const { data, error } = await supabase.from('expenses').select('*').order('date', { ascending: false });
      if (!error && data) {
        expenses = data;
        renderTransactions();
        updateAutoSuggest();
      }
    }

    function renderTransactions() {
      const container = document.getElementById('transaction-container');
      container.innerHTML = '';

      let totalExp = 0;
      const grouped = {};

      expenses.forEach(item => {
        totalExp += parseFloat(item.amount);
        const dateKey = item.date;
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push(item);
      });

      document.getElementById('total-exp').innerText = '£ ' + totalExp.toFixed(2);
      document.getElementById('net-total').innerText = '-£ ' + totalExp.toFixed(2);

      Object.keys(grouped).forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const dayNum = dateObj.getDate();
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });

        let dayTotal = grouped[dateStr].reduce((sum, item) => sum + parseFloat(item.amount), 0);

        let groupHtml = `
          <div class="day-group">
            <div class="day-header">
              <div>
                <strong>${dayNum}</strong>
                <span class="day-tag">${dayName}</span>
              </div>
              <div style="color: #ff5252; font-weight: 600;">£ ${dayTotal.toFixed(2)}</div>
            </div>
        `;

        grouped[dateStr].forEach(item => {
          groupHtml += `
            <div class="trans-row">
              <div class="trans-left">
                <span class="trans-category">${item.category}</span>
                <div class="trans-details">
                  <strong>${item.merchant}</strong>
                  <span>Credit Cards</span>
                </div>
              </div>
              <div class="trans-amount">£ ${parseFloat(item.amount).toFixed(2)}</div>
            </div>
          `;
        });

        groupHtml += `</div>`;
        container.innerHTML += groupHtml;
      });
    }

    function updateAutoSuggest() {
      const datalist = document.getElementById('merchant-list');
      const uniqueMerchants = [...new Set(expenses.map(e => e.merchant))];
      datalist.innerHTML = uniqueMerchants.map(m => `<option value="${m}">`).join('');
    }

    function openModal() {
      document.getElementById('entry-modal').style.display = 'flex';
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      amountString = "";
      document.getElementById('input-amount').value = "";
    }

    function closeModal() {
      document.getElementById('entry-modal').style.display = 'none';
    }

    function keyInput(val) {
      if (['+', '-', '*', '/'].includes(val)) {
        amountString += " " + val + " ";
      } else if (val === '=') {
        try { amountString = eval(amountString).toString(); } catch (e) { amountString = "0"; }
      } else {
        amountString += val;
      }
      document.getElementById('input-amount').value = amountString;
    }

    function keyBackspace() {
      amountString = amountString.trim().slice(0, -1);
      document.getElementById('input-amount').value = amountString;
    }

    async function saveTransaction() {
      const merchant = document.getElementById('input-merchant').value || 'Expense';
      let amount = parseFloat(eval(amountString || '0'));
      const category = document.getElementById('input-category').value;
      const date = document.getElementById('input-date').value;

      if (!amount || amount <= 0) {
        alert("Please enter an amount.");
        return;
      }

      const { error } = await supabase.from('expenses').insert([{
        merchant, amount, category, date, currency: '£'
      }]);

      if (error) {
        alert("Error saving: " + error.message);
      } else {
        document.getElementById('input-merchant').value = '';
        closeModal();
        fetchExpenses();
      }
    }

    fetchExpenses();
  </script>
</body>
</html>
