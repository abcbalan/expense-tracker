  <script>
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let expenses = [];
    let currentUser = null;
    let accessToken = localStorage.getItem('sb_access_token') || null;
    let currentUserEmail = (localStorage.getItem('sb_user_email') || '').toLowerCase().trim();
    let currentUserId = localStorage.getItem('sb_user_id') || null;
    let editingId = null;
    let currentDate = new Date();
    let expensesRealtime = null;
    let activeExpenseType = 'expense';

    /* try add income issue
    const baseCategories = ['Food', 'Social Life', 'Self-development', 'Transportation', 'Culture', 'Household', 'Apparel', 'Beauty', 'Health', 'Education', 'Gift', 'Other'];*/
    const baseCategories = ['Food', 'Social Life', 'Self-development', 'Transportation', 'Culture', 'Household', 'Apparel', 'Beauty', 'Health', 'Education', 'Gift', 'Salary','Other'];
    let customCategories = JSON.parse(localStorage.getItem('custom_categories') || '[]');
    let hiddenMerchants = JSON.parse(localStorage.getItem('hidden_merchants') || '[]');

    const categoryColors = {
      'Food': '#ff6384', 'Social Life': '#ff9f40', 'Self-development': '#ffcd56',
      'Transportation': '#4bc0c0', 'Culture': '#36a2eb', 'Household': '#9966ff',
      'Apparel': '#c9cbcf', 'Beauty': '#e7e9ed', 'Health': '#2ecc71',
      'Education': '#e74c3c', 'Gift': '#3498db', 'Other': '#95a5a6'
    };

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(window.atob(base64));
      } catch (e) {
        return null;
      }
    }

    function getUserStorageKey() {
      if (currentUserId) return `expenses_data_${currentUserId}`;
      if (currentUserEmail) return `expenses_data_${currentUserEmail}`;
      return 'expenses_data_guest';
    }

    function saveAuthState() {
      if (accessToken) localStorage.setItem('sb_access_token', accessToken);
      if (currentUserEmail) localStorage.setItem('sb_user_email', currentUserEmail);
      if (currentUserId) localStorage.setItem('sb_user_id', currentUserId);
    }

    function clearAuthState() {
      localStorage.removeItem('sb_access_token');
      localStorage.removeItem('sb_user_email');
      localStorage.removeItem('sb_user_id');
    }

    function getGuestStorageKey() { return 'expenses_data_guest'; }

    function mergeGuestLocalToUser() {
      const guestKey = getGuestStorageKey();
      const guestRaw = localStorage.getItem(guestKey);
      if (!guestRaw) return Promise.resolve();

      let guestEntries = [];
      try { guestEntries = JSON.parse(guestRaw) || []; } catch (e) { guestEntries = []; }

      if (!Array.isArray(guestEntries) || guestEntries.length === 0) {
        localStorage.removeItem(guestKey);
        return Promise.resolve();
      }

      if (!currentUser || !currentUser.id) return Promise.resolve();

      const userKey = getUserStorageKey();
      const existingRaw = localStorage.getItem(userKey);
      let existingEntries = [];
      try { existingEntries = existingRaw ? JSON.parse(existingRaw) : []; } catch (e) { existingEntries = []; }

      const merged = [...guestEntries, ...existingEntries];
      const seen = new Set();
      const deduped = [];
      merged.forEach(item => {
        if (!item || !item.id) return;
        if (seen.has(item.id)) return;
        seen.add(item.id);
        item.user_id = currentUser.id;
        deduped.push(item);
      });

      localStorage.setItem(userKey, JSON.stringify(deduped));
      localStorage.removeItem(guestKey);

      return Promise.all(deduped.map(async item => {
        try {
          await supabaseClient.from('expenses').upsert(item, { onConflict: 'id' });
        } catch (e) {
          console.warn('Failed to upload merged guest entry', e);
        }
      }));
    }

    function subscribeToExpenses() {
      if (!currentUser || !currentUser.id) return;
      if (expensesRealtime) {
        supabaseClient.removeChannel(expensesRealtime);
      }

      expensesRealtime = supabaseClient.channel('expenses-user-' + currentUser.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses', filter: `user_id=eq.${currentUser.id}` }, () => {
          syncWithSupabase();
        })
        .subscribe();
    }

    function unsubscribeFromExpenses() {
      if (expensesRealtime) {
        supabaseClient.removeChannel(expensesRealtime);
        expensesRealtime = null;
      }
    }

    if (accessToken) {
      const payload = parseJwt(accessToken);
      if (payload && payload.sub) currentUserId = payload.sub;
      if (currentUserId) saveAuthState();
    }

    async function initAuth() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        currentUser = session ? session.user : null;
        if (currentUser) {
          accessToken = session.access_token;
          currentUserEmail = (currentUser.email || '').toLowerCase().trim();
          currentUserId = currentUser.id;
          saveAuthState();
          document.getElementById('auth-screen').style.display = 'none';
        } else {
          document.getElementById('auth-screen').style.display = 'flex';
        }

        supabaseClient.auth.onAuthStateChange(async (_event, session) => {
          currentUser = session ? session.user : null;
          if (currentUser) {
            accessToken = session.access_token;
            currentUserEmail = (currentUser.email || '').toLowerCase().trim();
            currentUserId = currentUser.id;
            saveAuthState();
            document.getElementById('auth-screen').style.display = 'none';
            await mergeGuestLocalToUser();
            await syncWithSupabase();
            subscribeToExpenses();
          } else {
            accessToken = null;
            currentUserEmail = '';
            currentUserId = null;
            clearAuthState();
            unsubscribeFromExpenses();
            expenses = [];
            document.getElementById('auth-screen').style.display = 'flex';
            renderAllViews();
          }
        });
      } catch (e) {
        console.error('initAuth error', e);
        document.getElementById('auth-screen').style.display = 'flex';
      }
    }

    async function login() {
      const btnLogin = document.getElementById('btn-login');
      const emailInput = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errEl = document.getElementById('auth-error');

      errEl.innerText = '';
      if (!emailInput || !password) {
        errEl.innerText = 'Please enter email and password.';
        return;
      }

      btnLogin.innerText = 'Signing in...';
      btnLogin.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailInput, password });

        if (error) {
          errEl.innerText = error.message || 'Invalid login credentials.';
          btnLogin.innerText = 'Sign In';
          btnLogin.disabled = false;
          return;
        }

        if (!data || !data.session) {
          errEl.innerText = 'No session returned from Supabase.';
          btnLogin.innerText = 'Sign In';
          btnLogin.disabled = false;
          return;
        }

        accessToken = data.session.access_token;
        currentUser = data.user;
        currentUserEmail = (currentUser?.email || emailInput).toLowerCase().trim();

    function formatMoney(value) {
      const amount = Number(value) || 0;
      return `£ ${amount.toFixed(2)}`;
    }

    function getMonthStart(date = currentDate) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function getMonthExpenses() {
      const start = getMonthStart();
      const end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      const search = (document.getElementById('search-input') || {}).value || '';
      const term = search.trim().toLowerCase();

      return expenses.filter(item => {
        const d = new Date(item.date || item.created_at || new Date().toISOString());
        const inRange = d >= start && d < end;
        if (!inRange) return false;
        if (!term) return true;
        const merchant = (item.merchant || item.note || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        return merchant.includes(term) || category.includes(term);
      });
    }

    function updateMonthHeader() {
      const monthTxt = document.querySelectorAll('.current-month-txt');
      const label = currentDate.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });

    async function syncWithSupabase() {
      if (!currentUser || !currentUser.id) {
        renderAllViews();
        return;
      }

      try {
        const { data, error } = await supabaseClient.from('expenses').select('*').eq('user_id', currentUser.id);
        if (error) throw error;

        const remote = Array.isArray(data) ? data : [];
        const localMap = new Map((expenses || []).map(item => [String(item.id), item]));
        remote.forEach(item => {
          if (!localMap.has(String(item.id))) localMap.set(String(item.id), item);
        });

        const merged = [...localMap.values()].sort((a, b) => new Date(b.date || b.created_at) - new Date(a.date || a.created_at));
        expenses = merged;
        localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
      } catch (e) {
        console.warn('syncWithSupabase warning', e);
      }

      renderAllViews();
    }

    function getMonthlyTotals(items) {
      let income = 0;
      let expense = 0;
      items.forEach(item => {
        const amount = Number(item.amount) || 0;
        if ((item.type || 'expense') === 'income') income += amount;
        else expense += amount;
      });
      return { income, expense, total: income - expense };
    }

function renderCalendar() {
      const container = document.getElementById('calendar-container');
      if (!container) return;
      const month = getMonthStart();
      const year = month.getFullYear();
      const monthIndex = month.getMonth();
      const firstDay = new Date(year, monthIndex, 1);
      const lastDay = new Date(year, monthIndex + 1, 0);
      const firstWeekday = (firstDay.getDay() + 6) % 7;
      const daysInMonth = lastDay.getDate();
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      let cells = [];
      dayNames.forEach(name => cells.push(`<div class="cal-day-name">${name}</div>`));
      for (let i = 0; i < firstWeekday; i++) cells.push('<div class="cal-cell empty"></div>');
      const byDate = {};
      getMonthExpenses().forEach(item => {
        const key = (item.date || '').slice(8, 10);
        if (key) {
          if (!byDate[key]) byDate[key] = 0;
          const amount = Number(item.amount) || 0;
          if ((item.type || 'expense') === 'income') {
            byDate[key] += amount;
          } else {
            byDate[key] -= amount;
          }
        }
      });
      for (let day = 1; day <= daysInMonth; day++) {
        const key = String(day).padStart(2, '0');
        const net = byDate[key] || 0;
        if (net !== 0) {
          const isIncome = net >= 0;
          const formatted = `${isIncome ? '+' : '-'}${formatMoney(Math.abs(net))}`;
          cells.push(`<div class="cal-cell"><div class="cal-date-num">${day}</div><div class="cal-spend ${isIncome ? 'income' : 'expense'}">${formatted}</div></div>`);
        } else {
          cells.push(`<div class="cal-cell"><div class="cal-date-num">${day}</div></div>`);
        }
      }
      while (cells.length % 7 !== 0) {
        cells.push('<div class="cal-cell empty"></div>');
      }
      container.innerHTML = cells.join('');
    }
    
    function renderMonthlySummary() {
      const container = document.getElementById('monthly-container');
      if (!container) return;
      const monthItems = getMonthExpenses();
      const groups = {};
      monthItems.forEach(item => {
        const cat = item.category || 'Other';
        groups[cat] = (groups[cat] || 0) + (Number(item.amount) || 0);
      });

      const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);
      const total = sorted.reduce((sum, [, value]) => sum + value, 0) || 1;
      container.innerHTML = sorted.map(([name, value]) => `
        <div class="summary-item">
          <div class="summary-label"><span>${name}</span><span>${formatMoney(value)}</span></div>
          <div class="progress-bg"><div class="progress-fill" style="width:${(value / total) * 100}%; background:${categoryColors[name] || '#10b981'}"></div></div>

    function renderSummaryPanel() {
      const container = document.getElementById('summary-container');
      if (!container) return;
      const monthItems = getMonthExpenses();

      const categoryGroups = {};
      monthItems.forEach(item => {

        const cat = item.category || 'Other';
        categoryGroups[cat] = (categoryGroups[cat] || 0) + (Number(item.amount) || 0);
      });
      const totalSpend = Object.values(categoryGroups).reduce((sum, value) => sum + value, 0) || 1;

      const rows = Object.entries(categoryGroups).sort((a, b) => b[1] - a[1]).map(([cat, value]) => `
        <div class="summary-item">
          <div class="summary-label"><span>${cat}</span><span>${formatMoney(value)}</span></div>
          <div class="progress-bg"><div class="progress-fill" style="width:${(value / totalSpend) * 100}%; background:${categoryColors[cat] || '#10b981'}"></div></div>

        <div class="summary-item"><div class="summary-label"><span>Expenses</span><span>${formatMoney(totals.expense)}</span></div></div>

        ${rows || '<div class="summary-item"><div class="summary-label"><span>No expense data</span></div></div>'}
      `;
    }

function renderStats() {
      const container = document.getElementById('stats-list-container');
      const svg = document.getElementById('svgPie');
      if (!container || !svg) return;
      const monthItems = getMonthExpenses().filter(item => (item.type || 'expense') !== 'income');
      const totals = {};
      monthItems.forEach(item => {
        const name = item.category || 'Other';
        totals[name] = (totals[name] || 0) + (Number(item.amount) || 0);
      });

      const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      if (!entries.length) {
        container.innerHTML = '<div style="padding:20px; color:#6b7280; text-align:center;">No statistics yet</div>';
        svg.innerHTML = '';
        return;
      }

      const total = entries.reduce((sum, [, value]) => sum + value, 0) || 1;
      let cumulativeAngle = 0;

      const paths = entries.map(([name, value]) => {
        const percentage = value / total;
        const startAngle = cumulativeAngle;
        cumulativeAngle += percentage * 360;
        const endAngle = cumulativeAngle;

        const color = categoryColors[name] || '#10b981';

        // Handle full 100% single category case
        if (percentage === 1) {
          return `<circle cx="50" cy="50" r="50" fill="${color}"></circle>`;
        }

        const x1 = 50 + 50 * Math.cos(Math.PI * startAngle / 180);
        const y1 = 50 + 50 * Math.sin(Math.PI * startAngle / 180);
        const x2 = 50 + 50 * Math.cos(Math.PI * endAngle / 180);
        const y2 = 50 + 50 * Math.sin(Math.PI * endAngle / 180);
        const largeArcFlag = percentage > 0.5 ? 1 : 0;

        const pathData = `M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
        return `<path d="${pathData}" fill="${color}"></path>`;
      }).join('');

      svg.innerHTML = paths;

      container.innerHTML = entries.map(([name, value]) => {
        const percent = ((value / total) * 100).toFixed(0);
        const color = categoryColors[name] || '#10b981';
        return `
          <div class="stats-row">
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:8px;"></span>${name}</span>
            <span>${percent}%</span>
          </div>
        `;
      }).join('');
    }

    function applyKeyInput(val) {
      const input = document.getElementById('input-amount');
      if (!input) return;

      let currentVal = input.value.toString().trim();
      if (currentVal === '0.00' || currentVal === '0') currentVal = '';

      if (val === 'backspace') {
        currentVal = currentVal.slice(0, -1);
        input.value = currentVal === '' ? '0.00' : currentVal;
        return;
      }

      if (val === '+' || val === '-') {
        activeExpenseType = val === '+' ? 'income' : 'expense';
        /* word cancel next to Expense
        document.getElementById('modal-title').textContent = activeExpenseType === 'income' ? 'Income' : 'Expense';*/
        document.getElementById('modal-title').textContent = 'Expense / Income';
        return;
      }

      if (val === '.') {
        if (!currentVal.includes('.')) {
          input.value = (currentVal === '' ? '0' : currentVal) + '.';
        }
        return;
      }

      if (/^\d$/.test(val)) {
        // If there's already a decimal point, limit decimals to 2 places
        if (currentVal.includes('.')) {
          const parts = currentVal.split('.');
          if (parts[1] && parts[1].length >= 2) return;
        }
        input.value = currentVal === '0.00' ? val : currentVal + val;
      }
    }

      const data = expenses.map(item => ({
        date: item.date,
        merchant: item.merchant || item.note || '',
        category: item.category || 'Other',
        type: item.type || 'expense',
        amount: Number(item.amount || 0)
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Expenses');
      XLSX.writeFile(wb, 'expenses.xlsx');
    });

    document.getElementById('btn-sync').addEventListener('click', syncWithSupabase);
    document.getElementById('btn-stats-sync').addEventListener('click', syncWithSupabase);

    document.getElementById('import-file-input').addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = evt.target.result;
          const workbook = XLSX.read(data, { type: 'binary' });
          const firstSheet = workbook.SheetNames[0];
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
          json.forEach(row => {
            const entry = {
              id: crypto.randomUUID ? crypto.randomUUID() : `exp_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
              user_id: currentUser?.id || null,
              date: (row.date && new Date(row.date).toISOString().slice(0,10)) || new Date().toISOString().slice(0,10),
              merchant: row.merchant || row.note || '',
              note: row.merchant || row.note || '',
              category: row.category || 'Other',
              amount: Math.abs(Number(row.amount || row.value || 0)),
              type: (row.type || 'expense'),
              created_at: new Date().toISOString()
            };
            expenses.unshift(entry);
          });
          localStorage.setItem(getUserStorageKey(), JSON.stringify(expenses));
          renderAllViews();
        } catch (e) {
          console.error('Import failed', e);
          alert('Failed to import file');
        }
      };
      reader.readAsBinaryString(file);
    });

    // initialize UI
    initAuth();
    loadLocalForUser();
  </script>
</body>
</html>
