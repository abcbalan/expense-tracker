<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 12px;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { font-size: 22px; margin-bottom: 15px; text-align: center; }
    label { font-weight: 600; font-size: 15px; display: block; margin-top: 10px; }
    input, select, button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    input[type="checkbox"] { width: 18px; height: 18px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .checkbox-group label { margin-top: 0; font-weight: normal; }
    button.submit-btn {
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 15px;
      cursor: pointer;
    }
    
    /* View Tabs for Daily/Weekly/Monthly/Yearly */
    .tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 2px solid #eee; }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 14px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
    }
    .tab-btn.active { background: #2563eb; color: white; font-weight: bold; }
    
    .total-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #1e3a8a;
    }

    .expense-card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .expense-amount { font-size: 18px; font-weight: bold; color: #111827; }
    .delete-btn {
      background: none;
      border: none;
      color: #dc2626;
      font-size: 13px;
      cursor: pointer;
      width: auto;
      padding: 0;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Currency Selection -->
    <div>
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="£">£ (GBP)</option>
        <option value="$">$ (USD)</option>
        <option value="€">€ (EUR)</option>
      </select>
    </div>

    <!-- Expense Entry Form -->
    <form id="expense-form">
      <label for="merchant">Merchant / Shop</label>
      <input type="text" id="merchant" list="merchant-list" placeholder="e.g. Costco, Tesco" required>
      <datalist id="merchant-list"></datalist>

      <label for="amount">Amount</label>
      <input type="number" step="0.01" id="amount" placeholder="0.00" required>

      <label for="category">Category</label>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Household (Electric/Water)">Household (Electric/Water)</option>
        <option value="Car/Petrol">Car/Petrol</option>
        <option value="Subscriptions">Subscriptions</option>
        <option value="Other">Other</option>
      </select>

      <div class="checkbox-group">
        <input type="checkbox" id="recurring">
        <label for="recurring">Monthly Regular</label>
      </div>

      <button type="submit" class="submit-btn">Save Expense</button>
    </form>

    <!-- Reading Views Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
      <button class="tab-btn" onclick="setFilter('daily', this)">Daily</button>
      <button class="tab-btn" onclick="setFilter('weekly', this)">Weekly</button>
      <button class="tab-btn" onclick="setFilter('monthly', this)">Monthly</button>
      <button class="tab-btn" onclick="setFilter('yearly', this)">Yearly</button>
    </div>

    <div id="total-banner" class="total-banner">Total: £0.00</div>
    <div id="expense-list"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vikrhgqcajqjijzhxcbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa3JoZ3FjYWpxamlqemh4Y2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzQ1OTYsImV4cCI6MjEwNzcxMDU5Nn0.0c_sTu6wMnsL-8xsAsCtxh7ePXVmWgb1mzzwkAlKGkQ'; // Ensure your key stays here!
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let expenses = [];
    let currentFilter = 'all';

    async function loadExpenses() {
      const { data, error } = await supabase.from('expenses').select('*').order('date', { ascending: false });
      if (error) {
        alert("Error saving/loading: " + error.message);
      } else if (data) {
        expenses = data;
        renderList();
        updateAutoSuggest();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function filterExpenses() {
      const now = new Date();
      return expenses.filter(item => {
        const itemDate = new Date(item.date);
        if (currentFilter === 'daily') {
          return itemDate.toDateString() === now.toDateString();
        } else if (currentFilter === 'weekly') {
          const diffDays = (now - itemDate) / (1000 * 3600 * 24);
          return diffDays <= 7;
        } else if (currentFilter === 'monthly') {
          return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
        } else if (currentFilter === 'yearly') {
          return itemDate.getFullYear() === now.getFullYear();
        }
        return true;
      });
    }

    function renderList() {
      const listEl = document.getElementById('expense-list');
      const bannerEl = document.getElementById('total-banner');
      const currency = document.getElementById('currency').value;
      const filtered = filterExpenses();

      let total = filtered.reduce((sum, item) => sum + parseFloat(item.amount), 0);
      bannerEl.innerText = `Total: ${currency}${total.toFixed(2)}`;

      listEl.innerHTML = '';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'expense-card';
        div.innerHTML = `
          <div>
            <strong>${item.merchant}</strong>
            <div style="font-size: 13px; color: #666;">${item.category} • ${item.date}</div>
            ${item.is_recurring ? '<span style="font-size: 11px; background:#dbeafe; color:#1e40af; padding: 2px 4px; border-radius: 4px;">Monthly</span>' : ''}
          </div>
          <div style="text-align: right;">
            <div class="expense-amount">${item.currency || currency}${parseFloat(item.amount).toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteExpense('${item.id}')">Delete</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function updateAutoSuggest() {
      const datalist = document.getElementById('merchant-list');
      const uniqueMerchants = [...new Set(expenses.map(e => e.merchant))];
      datalist.innerHTML = uniqueMerchants.map(m => `<option value="${m}">`).join('');
    }

    async function deleteExpense(id) {
      await supabase.from('expenses').delete().eq('id', id);
      loadExpenses();
    }

    document.getElementById('expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const merchant = document.getElementById('merchant').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const is_recurring = document.getElementById('recurring').checked;
      const currency = document.getElementById('currency').value;

      const { error } = await supabase.from('expenses').insert([{
        merchant, amount, category, is_recurring, currency,
        date: new Date().toISOString().split('T')[0]
      }]);

      if (error) {
        alert("Failed to save: " + error.message);
      } else {
        document.getElementById('merchant').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('recurring').checked = false;
        loadExpenses();
      }
    });

    document.getElementById('currency').addEventListener('change', renderList);

    loadExpenses();
  </script>
</body>
</html>
